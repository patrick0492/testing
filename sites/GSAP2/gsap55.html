<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clip path hover GSAP</title>
  <link rel="stylesheet" href="./gsap55.css">
</head>
<body>
  <main class="app">
    <div class="section">
      <div class="section-wrapper">
        <div class="section-list">
          <div class="section-list-item">
            <h1>Blind</h1>
            <figure class="section-list-item-figure">
              <img src="./img/image001.jpg" alt="" class="section-list-item-image">
            </figure>
          </div>
          <div class="section-list-item">
            <figure class="section-list-item-figure">
              <img src="./img/image002.jpg" alt="" class="section-list-item-image">
            </figure>
            <h1>Rye</h1>
          </div>
          <div class="section-list-item">
            <h1>Specials</h1>
            <figure class="section-list-item-figure">
              <img src="./img/image003.jpg" alt="" class="section-list-item-image">
            </figure>
          </div>
          <div class="section-list-item">
            <figure class="section-list-item-figure">
              <img src="./img/image004.jpg" alt="" class="section-list-item-image">
            </figure>
            <h1>Portal</h1>
          </div>
          <div class="section-list-item">
            <h1>Rock</h1>
            <figure class="section-list-item-figure">
              <img src="./img/image005.jpg" alt="" class="section-list-item-image">
            </figure>
          </div>
        </div>
        <div class="section-media">
          <img src="./img/image001.jpg" class="section-media-image" alt="">
        </div>
        <div class="section-media">
          <img src="./img/image002.jpg" class="section-media-image" alt="">
        </div>
        <div class="section-media">
          <img src="./img/image003.jpg" class="section-media-image" alt="">
        </div>
        <div class="section-media">
          <img src="./img/image004.jpg" class="section-media-image" alt="">
        </div>
        <div class="section-media">
          <img src="./img/image005.jpg" class="section-media-image" alt="">
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script>
    const section = document.querySelector('.section'),
          sectionListItem = section.querySelectorAll('.section-list-item'),
          sectionListItemText = section.querySelectorAll('.section-list-item > h1'),
          sectionListFigure = section.querySelectorAll('.section-list-item-figure'),
          sectionMedia = section.querySelectorAll('.section-media');

    const clipPath = {
      top: 'polygon(0 0, 100% 0, 100% 0, 0 0)',
      full: 'polygon(0 0, 100% 0, 100% 100%, 0 100%)',
      bottom: 'polygon(0 100%, 100% 100%, 100% 100%, 0 100%)',
    };

    gsap.set(sectionMedia, {clipPath: clipPath.top});

    const initAnimation = () =>{
      gsap.set(sectionListItemText, {y: '100%'});

      const tlText = gsap.timeline({ defaults: {duration: 1.48, ease: 'expo.inOut'} });
      tlText.to(sectionListItemText,{
        y: '0%',
        stagger: 0.032,
      })
      .from(
        sectionListFigure,
        {
          width: 0,
          stagger: 0.032,
        },
        0.8
      );
      addEventListeners();
    };

    const addEventListeners = () =>{
      sectionListItem.forEach((item, index) =>{
        const images = sectionMedia[index]?.children;

        item.addEventListener('mouseenter', () =>{
          for (let i=0; i<images.length; i++){
            gsap.timeline({defaults: {duration: 0.64, ease: 'expo.inOut', overwrite: true},
          }).to(sectionMedia[index],{
            clipPath: clipPath.full,
          });

          sectionListItem.forEach((otherItem) =>{
            otherItem === item ? (otherItem.style.color = 'orange') : (otherItem.style.opacity = 0.5);
          });
          }
        });
        item.addEventListener('mouseleave', () =>{
          for(let i=0; i < images.length; i++){
            gsap.timeline({defaults: {duration: 0.64, ease: 'expo.inOut', overwrite: true},
          }).to(sectionMedia[index],{
            clipPath: clipPath.bottom,
            onComplete: () =>{
              gsap.set(sectionMedia[index],{
                clipPath: clipPath.top,
              });
            },
          });
          }
          sectionListItem.forEach((otherItem) =>{
            otherItem === item ? (otherItem.style.color = '#181818') : (otherItem.style.opacity = 1);
          });
        })
      });
    };

    initAnimation();
  </script>
</body>
</html>
