<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSAP Landing Page</title>
    <link rel="stylesheet" href="gsap64.css" />
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="col c-1">
        <div class="item"><img src="./img/0007.jpg" alt=""></div>
        <div class="item"><img src="./img/0013.jpg" alt=""></div>
        <div class="item"><img src="./img/0014.jpg" alt=""></div>
        <div class="item"><img src="./img/0016.jpg" alt=""></div>
        <div class="item"><img src="./img/0019.jpg" alt=""></div>
      </div>
      <div class="col c-2">
        <div class="item"><img src="./img/0030.jpg" alt=""></div>
        <div class="item"><img src="./img/0031.jpg" alt=""></div>
        <div class="item"><img src="./img/0032.jpg" alt=""></div>
        <div class="item"><img src="./img/0033.jpg" alt=""></div>
        <div class="item"><img src="./img/0034.jpg" alt=""></div>
      </div>
      <div class="col c-3">
        <div class="item"><img src="./img/0035.jpg" alt=""></div>
        <div class="item"><img src="./img/0036.jpg" alt=""></div>
        <div class="item"><img src="./img/image002.jpg" alt=""></div>
        <div class="item"><img src="./img/0038.jpg" alt=""></div>
        <div class="item"><img src="./img/0039.jpg" alt=""></div>
      </div>
      <div class="col c-4">
        <div class="item"><img src="./img/0040.jpg" alt=""></div>
        <div class="item"><img src="./img/0041.jpg" alt=""></div>
        <div class="item"><img src="./img/0042.jpg" alt=""></div>
        <div class="item"><img src="./img/0043.jpg" alt=""></div>
        <div class="item"><img src="./img/0044.jpg" alt=""></div>
      </div>
      <div class="col c-5">
        <div class="item"><img src="./img/0019.jpg" alt=""></div>
        <div class="item"><img src="./img/0007.jpg" alt=""></div>
        <div class="item"><img src="./img/0016.jpg" alt=""></div>
        <div class="item"><img src="./img/0014.jpg" alt=""></div>
        <div class="item"><img src="./img/0013.jpg" alt=""></div>
      </div>
    </div>
    <div class="content">
      <nav>
        <div class="nav-item">
          <a href="#!" id="active">Work</a>
        </div>
        <div class="nav-item">
          <a href="#!">About</a>
        </div>
      </nav>
      <div class="hero">
        <div class="icon"><ion-icon name="add-sharp"></ion-icon></div>
        <div class="title"><p>The regeneration Site</p></div>
        <div class="icon"><ion-icon name="add-sharp"></ion-icon></div>
      </div>
      <footer>
        <div class="preview">
          <img src="./img/0040.jpg" alt="">
          <img src="./img/0041.jpg" alt="">
          <img src="./img/0042.jpg" alt="">
          <img src="./img/0043.jpg" alt="">
          <img src="./img/0044.jpg" alt="">
          <img src="./img/0038.jpg" alt="">
          <img src="./img/0039.jpg" alt="">
        </div>
        <div class="slide-num"><p>1 &mdash; 3</p></div>
      </footer>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
      let tl = gsap.timeline({delay: 0});

      tl.to('.col',{
        top: 0,
        duration: 3, 
        ease: 'power4.inOut'
      })
      tl.to('.c-1 .item',{
        top: 0,
        stagger: 0.25,
        duration: 3,
        ease: 'power4.inOut'
      },'-=2');
      tl.to('.c-2 .item',{
        top: 0,
        stagger: -0.25,
        duration: 3,
        ease: 'power4.inOut'
      },'-=4');
      tl.to('.c-3 .item',{
        top: 0,
        stagger: 0.25,
        duration: 3,
        ease: 'power4.inOut'
      },'-=4');
      tl.to('.c-4 .item',{
        top: 0,
        stagger: -0.25,
        duration: 3,
        ease: 'power4.inOut'
      },'-=4');
      tl.to('.c-5 .item',{
        top: 0,
        stagger: 0.25,
        duration: 3,
        ease: 'power4.inOut'
      },'-=4');
      tl.to('.container',{
        scale: 6,
        duration: 4,
        ease: 'power4.inOut'
      },'-=2');
      tl.to('.nav-item a, .title p, .slide-num p, .preview img',{
        top: 0,
        stagger: 0.075,
        duration: 1,
        ease: 'power3.out'
      },'-=1.5');
      tl.to('.icon ion-icon, icon-2 ion-icon',{
        scale: 1,
        stagger: 0.5,
        ease: 'power3.out,'
      },'-=1');
    </script>
  </body>
</html>
