<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSAP ScrollTrigger Gallery</title>
    <link rel="stylesheet" href="gsap62.css" />
  </head>
  <body>
    <nav>
      <p>Codegrid</p>
      <p>Subscribe</p>
    </nav>

    <footer>
      <p>ScrollTrigger Gallery</p>
      <p>Link in description</p>
    </footer>

    <div class="preview-img">
      <img src="./img/0034.jpg" alt="">
    </div>

    <div class="container">
      <div class="gallery">

      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script>
      window.onload = function () {
        const gallery = document.querySelector(' .gallery');
        const previewImage = document.querySelector('.preview-img img');

        document.addEventListener('mousemove', function (event){
          const x = event.clientX;
          const y = event.clientY;

          const centerX = window.innerWidth / 2;
          const centerY = window.innerHeight / 2;

          const percentX = (x - centerX) / centerX;
          const percentY = (y - centerY) / centerY;

          const rotateX = 55 + percentY * 2;
          const rotateY = percentX * 2;

          gsap.to(gallery,{
            duration: 1,
            ease: 'power2.out',
            rotateX: rotateX,
            rotateY: rotateY,
            overwrite: 'auto',
          });
        });

        for (let i = 0; i < 150; i++){
          const item = document.createElement('div');
          item.className = 'item';
          const img = document.createElement('img');
          img.src = './img/000' +((i % 14) + 1) + '.jpg';
          item.appendChild(img);
          gallery.appendChild(item);
        }

        const items = document.querySelectorAll('.item');
        const numberOfItems = items.length;
        const angleIncrement = 360 / numberOfItems;

        items.forEach((item, index) =>{
          gsap.set(item,{
            rotationY: 90,
            rotationZ: index * angleIncrement - 90,
            transformOrigin: '50% 400px',
          });

          item.addEventListener('mouseover', function(){
            const imgInsideItem = item.querySelector('img');
            previewImage.src = imgInsideItem.src;

            gsap.to(item,{
              X: 10,
              z: 10,
              y: 10,
              ease: 'power2.out',
              duration: 0.5,
            });
          });

          item.addEventListener('mouseout', function(){
            previewImage.src = './img/0034.jpg';
            gsap.to(item,{
              x: 0,
              y: 0,
              z: 0,
              ease: 'power2.out',
              duration: 0.5,
            });
          });
        });

        ScrollTrigger.create({
          trigger: 'body',
          start: 'top top',
          end: 'bottom bottom',
          scrub: 2,
          onRefresh: setupRotation,
          onUpdate: (self) => {
            const rotationProgress = self.progress * 360 * 1;
            items.forEach((item, index) =>{
              const currentAngle = index * angleIncrement - 90 + rotationProgress;
              gsap.to(item,{
                rotationZ: currentAngle,
                duration:  1,
                ease: 'power3.out',
                overwrite: 'auto',
              });
            });
          },
        });
      };
      function setupRotation(){}
    </script>
  </body>
</html>
