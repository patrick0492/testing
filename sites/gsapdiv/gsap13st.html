<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSAP</title>
  <link rel="stylesheet" href="gsap13.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.6.0/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.7.1/ScrollTrigger.min.js"></script>
</head>
<body>
  <div class="main">
    <div class="header">
      <div class="logo">
        <h4 class="heading-4">m.</h4>
      </div>
      <div class="nav">
        <div class="burger-icon"></div>
      </div>
    </div>
    <div class="center-info">
      <div class="center-info__box center-box">
        <div class="center-info__box-left">Sort by <span>Latest</span></div>
        <div class="center-info__box-right">2020</div>
      </div>
    </div>
    <section class="section section-one">
      <figure class="image-container one">
        <img src="img/BGpics022.jpg" alt="">
        <figcaption class="caption">21</figcaption>
      </figure>
      <figure class="image-container">
        <img src="img/BGpics025.jpg" alt="" class="imageSecond">
        <figcaption class="caption imageSecondCap">Flower</figcaption>
      </figure>
      <figure class="image-container imageThird">
        <div class="fig">Sort of</div>
        <figcaption class="caption">Lorem ipsum dolor sit amet consectetur adipisicing elit. Quasi quibusdam unde officiis veniam suscipit soluta reiciendis, esse ad maxime ipsa, sunt, laborum officia? Magni, delectus?</figcaption>
      </figure>
      <figure class="image-container">
        <figcaption class="caption imageFourthCap">
          '20
        </figcaption>
        <img src="img/BGpics077.jpg" alt="" class="imageFourth">
        <figcaption class="caption">
          Glossary
        </figcaption>
      </figure>
      <figure class="image-container">
        <img src="img/BGpics073.jpg" alt="" class="imageFifth">
      </figure>
    </section>

    <section class="section-two">
      <div class="letter">
        <span>A</span>
        <span>(2 Items)</span>
      </div>
      <div class="titles">
        <div class="title-1">
          <span class="num">01</span>
          <h1>Alstroemeria</h1>
        </div>
        <div class="title-1">
          <span class="num">02</span>
          <h1>Amaryllis</h1>
        </div>
      </div>
      <p class="paragraph">Lorem ipsum dolor sit amet consectetur adipisicing elit. Expedita laudantium optio accusantium repudiandae? A expedita ullam fuga qui numquam quaerat quam asperiores ipsum sunt corrupti.</p>
      <figure class="image-1">
        <img src="img/BGpics076.jpg" alt="">
      </figure>
      <figure class="image-2">
        <img src="img/BGpics079.jpg" alt="">
      </figure>
    </section>
  </div>
  
  <script>
    // const timeline = gsap.timeline();
    gsap.registerPlugin(ScrollTrigger);

    gsap.from('.header', {
      delay: 0.4,
      duration: 0.8,
      y: 30,
      opacity: 0,
      stagger: 0.15,
    });
    gsap.from('.center-box', {
      delay: 0.5,
      duration: 0.8,
      y: 90,
      opacity: 0,
      stagger: 0.15,
    });
    gsap.from('.section-one', {
      delay: 0.7,
      duration: 0.5,
      y: 70,
      opacity: 0,
      stagger: 0.1,
    });

    gsap.to('.center-box', {
      scrollTrigger: {
        trigger: '.center-box',
        scrub: true,
        start: '-130px top',
      },
      duration: 0.6,
      y: -40,
      opacity: 0.3,
      stagger: 0.15,
    });
    gsap.to('.imageSecond', {
      scrollTrigger: {
        trigger: '.imageSecond',
        scrub: true,
        start: '40% center',
      },
      duration: 0.6,
      y: -90,
    });
    gsap.to('.imageSecondCap', {
      scrollTrigger: {
        trigger: '.imageSecondCap',
        scrub: true,
        start: '-200px center',
      },
      duration: 1,
      y: 90,
    });
    gsap.to('.imageThird', {
      scrollTrigger: {
        trigger: '.imageSecond',
        scrub: true,
        start: '40% center',
      },
      duration: 0.6,
      y: -90,
    });
    gsap.to('.imageFourth', {
      scrollTrigger: {
        trigger: '.imageFourth',
        scrub: true,
        start: '40% center',
      },
      duration: 0.6,
      y: -90,
    });
    gsap.to('.imageFourthCap', {
      scrollTrigger: {
        trigger: '.imageFourth',
        scrub: true,
        start: '40% center',
      },
      duration: 0.6,
      y: -90,
    });
    gsap.to('.imageFifth', {
      scrollTrigger: {
        trigger: '.imageFifth',
        scrub: true,
        start: '20% center',
      },
      duration: 1,
      y: -50,
    });

    gsap.from('.letter', {
      scrollTrigger: {
        trigger: '.letter',
        scrub: true,
        start: '-200px center',
      },
      duration: 0.5,
      y: -40,
      opacity: 0,
      stagger: 0.15,
    });
    gsap.from('.titles', {
      scrollTrigger: {
        trigger: '.titles',
        scrub: true,
        start: '-200px center',
      },
      duration: 0.5,
      y: -40,
      opacity: 0,
      stagger: 0.15,
    });
    gsap.from('.paragraph', {
      scrollTrigger: {
        trigger: '.titles',
        scrub: true,
        start: 'center center',
      },
      duration: 0.5,
      y: -40,
      opacity: 0,
    });
    gsap.from('.image-1', {
      scrollTrigger: {
        trigger: '.image-1',
        scrub: true,
      },
      duration: 0.5,
      opacity: 0,
      x: -40,
    });
    gsap.from('.image-2', {
      scrollTrigger: {
        trigger: '.image-2',
        scrub: true,
      },
      duration: 0.5,
      opacity: 0,
      x: 80,
    });
  </script>
</body>
</html>
