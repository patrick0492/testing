<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSAP</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="gsap08.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.7.1/gsap.min.js"></script>
</head>
<body>
  <header>
    <div class="logo">
      <a href="#!">Patrick<br>Online</a>
    </div>
    <div class="menu">
      <a href="#!">.Menu</a>
    </div>
  </header>
  <div class="pics">
    <div class="pic1"></div>
    <div class="pic2"></div>
    <div class="pic3"></div>
    <div class="pic4"></div>
  </div>
  <div class="center-text">
    <div class="text">
      Be somebody
      <br>
      who makes everybody <br>
      feel like somebody
    </div>
  </div>
  <div class="circle1"></div>
  <div class="circle2"></div>
  
  
  <!-- .li$.li*4>a.a$ voor vier li met opvolgende classnummers plus links met hetzelfde -->
  <!-- divname>divname>flexone+.flextwo -->
  <script>
    const timeline = gsap.timeline();
    timeline.from('.text',{
      duration: 1.8,
      delay: .5,
      opacity: 0,
      ease: 'power4.out',
      x: 150,
      skewX: 20,
      stagger:{
        amount: .4
      }
    });
    timeline.from('.logo, .menu',{
      duration: .6,
      y: 100,
      stagger:{
        amount: .4
      }
    },'-=.3');
    timeline.from('.pic1',{
      duration: 1,
      position: 'absolute',
      top: '100%',
      left: '50%',
      ease: 'power2.out',
      x: '-50%',
      y: '-50%',
      filter: 'grayscale(1)'
    })
    timeline.from('.pic2',{
      duration: 1.5,
      position: 'absolute',
      top: '100%',
      left: '50%',
      ease: 'power2.out',
      x: '-50%',
      y: '-50%',
      filter: 'grayscale(1)'
    },'-=.5')
    timeline.from('.pic3',{
      duration: 1.5,
      position: 'absolute',
      top: '100%',
      left: '50%',
      ease: 'power2.out',
      x: '-50%',
      y: '-50%',
      filter: 'grayscale(1)'
    },'-=.5')
    timeline.from('.pic4',{
      duration: 1.5,
      position: 'absolute',
      top: '100%',
      left: '50%',
      ease: 'power2.out',
      x: '-50%',
      y: '-50%',
      filter: 'grayscale(1)'
    },'-=.5')

    timeline.from('.circle1, .circle2',{
      duration: .8,
      height: 0,
      width: 0,
      ease: 'power4.out',
      stagger:{
        amount: .8
      }
    },'-=.5')
  </script>
</body>
</html>
