<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSAP Gallery</title>
  <link rel="stylesheet" href="gsap44.css">
</head>
<body>
  <div class="container">
    <div class="nav">
      <a href="#!">Neural Nuance</a>
      <a href="#!">Showreel</a>
    </div>
    <div class="footer">
      <a href="#!">Behance</a>
      <a href="#!">Catalog</a>
    </div>
    <div class="header">
      <div class="text">
        <p>In a futurer</p>
        <div class="text-revealer"></div>
      </div>
      <div class="text">
        <p>Not too distant</p>
        <div class="text-revealer"></div>
      </div>
    </div>
    <div class="gallery">
      <div class="img">
        <img src="../gsapdiv/img/0001.jpg" alt="">
      </div>
      <div class="img">
        <img src="../gsapdiv/img/0002.jpg" alt="">
      </div>
      <div class="img">
        <img src="../gsapdiv/img/0003.jpg" alt="">
      </div>
      <div class="img">
        <img src="../gsapdiv/img/0004.jpg" alt="">
      </div>
      <div class="img">
        <img src="../gsapdiv/img/0005.jpg" alt="">
      </div>
      <div class="img">
        <img src="../gsapdiv/img/0006.jpg" alt="">
      </div>
      <div class="img">
        <img src="../gsapdiv/img/0007.jpg" alt="">
      </div>
      <div class="img">
        <img src="../gsapdiv/img/0008.jpg" alt="">
      </div>
      <div class="img">
        <img src="../gsapdiv/img/0009.jpg" alt="">
      </div>
      <div class="img">
        <img src="../gsapdiv/img/0010.jpg" alt="">
      </div>
      <div class="img">
        <img src="../gsapdiv/img/0011.jpg" alt="">
      </div>
      <div class="img">
        <img src="../gsapdiv/img/0012.jpg" alt="">
      </div>
      <div class="img">
        <img src="../gsapdiv/img/0013.jpg" alt="">
      </div>
      <div class="img">
        <img src="../gsapdiv/img/0014.jpg" alt="">
      </div>
    </div>
  </div>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <script>
    const positions = [
      { top: '0%', left: '0%'},
      { top: '0%', left: '10%'},
      { top: '0%', left: '60%'},
      { top: '16%', left: '15%'},
      { top: '16%', left: '40%'},
      { top: '16%', left: '90%'},
      { top: '32%', left: '50%'},
      { top: '32%', left: '75%'},
      { top: '48%', left: '0%'},
      { top: '64%', left: '30%'},
      { top: '64%', left: '50%'},
      { top: '64%', left: '90%'},
      { top: '80%', left: '20%'},
      { top: '80%', left: '70%'},
    ];

    const imgs = document.querySelectorAll('.img');

    gsap.set('.img',{
      top: '45%',
      left: '50%',
      transform: 'translate(-50%, -50%) scale(0)',
    });

    gsap.from('p',{
      y: 40,
      ease: 'power4.inOut',
      duration: 1,
      stagger: {
        amount: 0.15,
      },
      delay: 0.5,
    });

    gsap.to('.img',{
      scale: 1,
      width: '300px',
      height: '400px',
      stagger: 0.15,
      duration: 0.75,
      ease: 'power2.out',
      delay: 1,
      onComplete: scatterAndShrink,
    });

    gsap.to('p',{
      top: '40px',
      ease: 'power4.inOut',
      duration: 1,
      stagger: {
        amount: 0.15,
      },
      delay: 3,
      onComplete: () =>{
        document.querySelector('.header').remove();
      },
    });

    gsap.from('a',{
      y: 20,
      opacity: 0,
      ease: 'power2.out',
      duration: 1,
      stagger: {
        amount: 0.15,
      },
      delay: 4,
    });

    function scatterAndShrink(){
      gsap.to('.img',{
        top: (i) => positions[i].top,
        left: (i) => positions[i].left,
        transform: 'none',
        width: '75px',
        height: '100px',
        stagger: 0.075,
        duration: 0.75,
        ease: 'power2.out',
      });
    }
  </script>
</body>
</html>
