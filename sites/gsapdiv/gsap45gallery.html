<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSAP Gallery</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/locomotive-scroll@3.5.4/dist/locomotive-scroll.css">
  <link rel="stylesheet" href="gsap45.css">
</head>
<body>
  <div class="container" data-scroll-container>
    <h1 data-scroll-section>Drive / Moment</h1>
    <div class="gallery" data-scroll-section></div>
  </div>
  <div class="img-modal">
    <div class="modal-item img-name">
      <p>img name</p>
      <div class="modal-item-revealer"></div>
    </div>
    <div class="modal-item close-btn">
      <p>Close</p>
      <div class="modal-item-revealer"></div>
    </div>
    <div class="img">
      <img src="../img/gsap45/001.jpg" alt="">
    </div>
  </div>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/locomotive-scroll@3.5.4/dist/locomotive-scroll.min.js"></script>

  <script>
    function generateRandomName() {
      const characters =
      'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_';
      const nameLength = Math.floor(Math.random() * 3) + 6;

      let randomName = '';
      for (let i = 0; i < nameLength; i++){
        const randomIndex = Math.floor(Math.random() * characters.length);
        randomName += characters.charAt(randomIndex);
      }

      return randomName + '.jpg';
    }

    function generateRandomImageName(){
      const imageNumber = Math.floor(Math.random() * 20) + 1;
      return `00${imageNumber}.jpg`;
    }

    document.addEventListener( 'DOMContentLoaded', function () {
      const galleryContainer = document.querySelector('.gallery');
      const imgModal = document.querySelector('.img-modal');
      const imgViewContainer = imgModal.querySelector('.img');
      const modalName = imgModal.querySelector('.img-name p');

      const tl = gsap.timeline({ paused: true});
      let clickedItemImgSrc = '';
      let clickedItemName = '';

      for (let i = 0; i <= 79; i++){
        const item = document.createElement('div');
        item.classList.add('item');
        const itemImg = document.createElement('div');
        itemImg.classList.add('item-img');
        const imgTag = document.createElement('img');
        const randomImageName = generateRandomImageName();
        imgTag.src = `../gsapdiv/img/gsap45/${randomImageName}`;
        itemImg.appendChild(imgTag);

        const itemName = document.createElement('div');
        itemName.classList.add('item-name');
        const randomName = generateRandomName();
        itemName.innerHTML = `<p>${randomName}</p>`;
        itemName.setAttribute('data-img', randomImageName.replace('.jpg', ''));

        item.appendChild(itemImg);
        item.appendChild(itemName);

        item.addEventListener('click', () => {
          const dataImg = itemName.getAttribute('data-img');
          if (imgViewContainer && modalName){
            clickedItemImgSrc = `../gsapdiv/img/gsap45/${dataImg}.jpg`;
            clickedItemName = itemName.textContent;
            imgViewContainer.innerHTML = `<img src='${clickedItemImgSrc}' alt="" />`;
            modalName.textContent = clickedItemName;
            tl.reversed(!tl.reversed());
          }
        });

        galleryContainer.appendChild(item);
      }

      const closeBtn = document.querySelector('.close-btn');
      if (closeBtn) {
        closeBtn.addEventListener('click', () => {
          tl.reversed(!tl.reversed());
        });
      }

      function revealModal(){
        tl.to('.img-modal', 0.75, {
          clipPath: 'polygon(0 0%, 100% 0%, 100% 100%, 0% 100%)',
          ease: 'power4.inOut',
          pointerEvents: 'auto',
        });

        tl.to('.img-modal .img', 0.75, {
          clipPath: 'polygon(0 0%, 100% 0%, 100% 100%, 0% 100%)',
          ease: 'power4.inOut',
        });

        tl.to('.modal-item p',1,{
          top: 0,
          ease: 'power4.inOut',
          stagger: {
            amount: 0.2,
          },
        }, '<').reverse();

      }
      revealModal();
    });


  </script>

  <script>
   window.addEventListener('load', () => {
    const scroll = new LocomotiveScroll({
      el: document.querySelector('[data-scroll-container]'),
      smooth: true,
      multiplier: 0.75,
      scrollFromAnywhere: true,
    });
   });
  </script>
</body>
</html>
