<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Locomotive Scroll</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/locomotive-scroll@3.5.4/dist/locomotive-scroll.css">
  <link rel="stylesheet" href="locomotive.css">
</head>
<body>
  <div class="container" data-scroll-container>
    <div class="grid">
      <div>

        <img src="img/cocktail02.jpg" alt="" data-scroll data-scroll-speed="6">
      </div>
      <div>

        <img src="img/cocktail02.jpg" alt="" data-scroll data-scroll-speed="-10">
      </div>
    </div>
    <div class="text" data-scroll data-scroll-speed="3">
      <h1>The Scrolling Animation</h1>
    </div>
    <div class="section">
      <div class="span">
        <span data-scroll data-scroll-speed="2">S</span>
        <span data-scroll data-scroll-speed="-1">c</span>
        <span data-scroll data-scroll-speed="3">r</span>
        <span data-scroll data-scroll-speed="-1">o</span>
        <span data-scroll data-scroll-speed="3">l</span>
        <span data-scroll data-scroll-speed="-1.3">l</span>
        <span data-scroll data-scroll-speed="3">i</span>
        <span data-scroll data-scroll-speed="-1">n</span>
        <span data-scroll data-scroll-speed="3">g</span>
      </div>
    </div>
    <div class="paragraph" data-scroll data-scroll-speed="2">
      <p data-scroll data-scroll-speed="-2" data-scroll-direction="horizontal">Do you love to scroll</p>
      <p data-scroll data-scroll-speed="2" data-scroll-direction="horizontal">Scroll more to see</p>
    </div>
    <div class="sticky">
      <div id="pinsection">
        <div data-scroll data-scroll-sticky data-scroll-target="#pinsection">
          <h1>5<br/>M</h1>
          <p data-scroll data-scroll-speed="2" data-scroll-direction="bottom">TO SEE</p>
        </div>
      </div>
      <div class="img-container">
        <p>Locomotive animation</p>
        <div class="img">
          <img src="img/balloon1.jpg" alt="">
          <img src="img/balloon2.jpg" alt="">
          <img src="img/balloon3.jpg" alt="">
          <img src="img/balloon4.jpg" alt="">
        </div>
      </div>
    </div>
    <div class="footer">
      <div class="img-wrapper">
        <img src="img/cocktail.jpg" alt="">
      </div>
      <div class="ftext">
        <h1 data-scroll data-scroll-speed="2">Subscribe for more scrolling animation</h1>
        <p data-scroll data-scroll-position="bottom">Leave your comments</p>
      </div>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/locomotive-scroll@3.5.4/dist/locomotive-scroll.min.js"></script>

  <script>
    const scroller = new LocomotiveScroll({
      el: document.querySelector('[data-scroll-container]'),
      smooth: true,
    })
  </script>
</body>
</html>
