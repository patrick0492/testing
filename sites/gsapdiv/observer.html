<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IntersectionObserver</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="observer.css">
</head>
<body>
  <nav>
    <h4>your style, <span>our work.</span></h4>
  </nav>
  <h1>
    <span>YOUR STYLE,</span>
    <span>OUR WORK</span>
  </h1>
  <div class="line"></div>
  <div class="images-container">
    <img src="img/balloon1.jpg" alt="">
    <img src="img/balloon2.jpg" alt="">
    <img src="img/balloon3.jpg" alt="">
    <img src="img/balloon4.jpg" alt="">
    <img src="img/BG01.PNG" alt="">
    <img src="img/BG02.PNG" alt="">
    <img src="img/BG03.PNG" alt="">
    <img src="img/BG04.PNG" alt="">
  </div>

  <div class="images-container2">
    <img class="imgfade" src="img/balloon1.jpg" alt="">
    <img class="imgfade" src="img/balloon2.jpg" alt="">
    <img class="imgfade" src="img/balloon3.jpg" alt="">
    <img class="imgfade" src="img/balloon4.jpg" alt="">
    <img class="imgfade" src="img/BG01.PNG" alt="">
    <img class="imgfade" src="img/BG02.PNG" alt="">
    <img class="imgfade" src="img/BG03.PNG" alt="">
    <img class="imgfade" src="img/BG04.PNG" alt="">
  </div>

  <script>
    const images = document.querySelectorAll('.images-container img')
    
    let options = {
      // root: null,
      rootMargin: '-20% 0px',
      threshold: 0
    }
    
    function handleIntersect(entries){
      console.log(entries);
      entries.forEach(entry =>{
        if(entry.isIntersecting){
          entry.target.style.opacity = 1;
        }
      })
    }

    const observer = new IntersectionObserver(handleIntersect, options)
    images.forEach(image =>{
      observer.observe(image)
    })

    // SECOND IO
    const nav = document.querySelector('h4');

    const navObs = new IntersectionObserver((entries) => nav.classList.toggle('active', !entries[0].isIntersecting),{threshold: .99})
    
    navObs.observe(document.querySelector('.line'));
    // als threshold 99% van de line die geobserveerd wordt in beeld is dan gebeurt het met .99
    // als .00 gebruikt wordt, dan moet de line bijna helemaal weg zijn voor het gebeurt

    const fadeUpObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry =>{
        console.log(entry)
        if(entry.isIntersecting){
          entry.target.classList.add('faded');
          fadeUpObserver.unobserve(entry.target)
        }
      })
    },{
      rootMargin: '-25%'
    })

    document.querySelectorAll('.imgfade').forEach(el =>{
      fadeUpObserver.observe(el);
    })
  </script>
  
</body>
</html>
