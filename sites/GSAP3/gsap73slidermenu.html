    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
      const slider = document.querySelector('.slider');
      const cards = document.querySelectorAll('.card');
      const ease = .1;

      let currentX = 0;
      let targetX = 0;

      const getScaleFactor = (position, viewportWidth) =>{
        const quaterWidth = viewportWidth / 4;
        if (position < 0 || position > viewportWidth){
          return 0;
        } else if (position < quaterWidth){
          return lerp(0, 0.45, position / quaterWidth);
        } else if (position < 2 * quaterWidth){
          return lerp(0.45, 1.5, (position - quaterWidth) / quaterWidth);
        } else if  (position < 3 * quaterWidth){
          return lerp(1.5, 0.45, (position - 2 * quaterWidth) / quaterWidth);
        } else{
          return lerp(0.45, 0, (position - 3 * quaterWidth) / quaterWidth);
        }
      };

      const updateScales = () =>{
        const viewportWidth = window.innerWidth;
        cards.forEach((card) =>{
          const cardRect = card.getBoundingClientRect();
          const cardCenter = cardRect.left + cardRect.width / 2;
          const scaleFactor = getScaleFactor(cardCenter, viewportWidth);
          const imgScaleFactor = scaleFactor * 1.1;
          const img = card.querySelector('img');
          card.style.transform = `scale(${scaleFactor})`;
          img.style.transform = `scale(${imgScaleFactor})`;
        });
      };

      const lerp = (start, end, t) =>{
        return start * (1 - t) + end * t;
      };

      const update = () =>{
        currentX = lerp(currentX, targetX, ease);
        slider.style.transform = `translateX(${currentX}%)`;
        updateScales();
        requestAnimationFrame(update);
      };

      window.addEventListener('scroll', () =>{
        const maxScroll = document.body.scrollHeight - window.innerHeight;
        const scrollProgress = window.scrollY / maxScroll;
        targetX = -scrollProgress * 75;
      });

      update();

      // img hover effect
      const blocks = document.querySelectorAll('.block');
      const resetDuration = 300;

      blocks.forEach((block) =>{
        let timeOutId;

        block.addEventListener('mouseover', () =>{
          clearTimeout(timeOutId);
          block.classList.add('active');
          timeOutId = setTimeout(() =>{
            block.classList.remove('active');
          }, resetDuration);
        });
      });

      // Menu
      window.addEventListener('DOMContentLoaded', () =>{
        const menu = document.querySelector('.content-overlay');
        gsap.set(menu, {opacity: 0});

        const squareContainer = document.getElementById('square-container');
        const squareSize = 100;
        const screenWidth = window.innerWidth;
        const screenHeight = window.innerHeight;
        const numCols = Math.ceil(screenWidth / squareSize);
        const numRows = Math.ceil(screenHeight / squareSize);

        const numSquares = numCols * numRows;

        squareContainer.style.width = `${numCols * squareSize}px`;
        squareContainer.style.height = `${numRows * squareSize}px`;

        let squares = [];

        function createSquares(){
          for (let i = 0; i < numSquares; i++){
            const square = document.createElement('div');
            square.classList.add('square');
            squareContainer.appendChild(square);
            squares.push(square);
          }
        }
        function animateSquares(){
          gsap.fromTo(
            squares,{
              opacity: 0,
            },
            {
              opacity: 1,
              delay: 0.5,
              duration: 0.0005,
              stagger:{
                each: 0.004,
                from: 'random',
              },
            }
          );

          gsap.to(squares,{
            opacity: 0,
            delay: 1.5,
            duration: 0.0005,
            stagger:{
              each: 0.004,
              from: 'random'
            },
          });
        }

        let overlayVisible = false;

        document.getElementById('menu-btn').addEventListener('click', () =>{
          squareContainer.innerHTML = '';
          squares = [];
          createSquares();
          animateSquares();

          gsap.to(menu, 0.025,{
            opacity: overlayVisible ? 0 : 1,
            visibility: overlayVisible ? 'hidden' : 'visible',
            delay: 1.15,
          });

          gsap.to(menu,{
            zIndex: overlayVisible ? -1 : 0,
            delay: overlayVisible ? 1 : 1
          });

          overlayVisible = !overlayVisible;
        })
      })
    </script>
