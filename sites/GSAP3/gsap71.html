<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSAP Landing Slider</title>
    <link rel="stylesheet" href="gsap71.css" />
  </head>
  <body>
    <div class="container">
      <nav>
        <div class="menu-btn">
          <p>Menu</p>
        </div>
        <div class="logo">
          <a href="#!">Thetalab</a>
        </div>
        <div class="local-time">
          <p>ON 3:45PM</p>
        </div>
      </nav>

      <footer>
        <p>Watch Showreel</p>
        <p>Collection 2024</p>
      </footer>

      <div class="items">
        <div class="item"><p>Ra</p></div>
        <div class="item"><p>Uptask</p></div>
        <div class="item"><p>Genix</p></div>
        <div class="item"><p>Unor</p></div>
        <div class="item"><p>Maxim Stark</p></div>
        <div class="item"><p>Pitcher</p></div>
        <div class="item"><p>Mindspace</p></div>
        <div class="item"><p>The Athletix</p></div>
        <div class="item"><p>All Work</p></div>
      </div>

      <div class="preview-bg">
        <img src="./img/image001.jpg" alt="">
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
      const mapClasses = [
      "variant-1",
      "variant-2",
      "variant-3",
      "variant-1",
      "variant-2",
      "variant-3",
      "variant-1",
      "variant-2",
      "variant-3",
      "variant-1",
    ];
    const previews = [
      {
        img: "./img/0035.jpg",
        title: "Ra",
        tags: "Futuristic Fashion, Minimal Design",
        description:
          "Exploring the intersection of minimalism and future fashion trends in web design.",
      },
      {
        img: "./img/0036.jpg",
        title: "Uptask",
        tags: "Fashion Innovation, Graphic Simplicity",
        description:
          "Innovative fashion-forward web design with a core focus on simplicity and elegance.",
      },
      {
        img: "./img/0037.jpg",
        title: "Genix",
        tags: "Eco-Fashion, Sustainable Design",
        description:
          "Sustainable fashion meets modern web aesthetics, highlighting eco-friendly apparel innovations.",
      },
      {
        img: "./img/0038.jpg",
        title: "Unor",
        tags: "Digital Fashion, UI/UX",
        description:
          "Digital-first fashion branding that merges cutting-edge UI/UX principles with style.",
      },
      {
        img: "./img/0039.jpg",
        title: "Xav",
        tags: "Interactive Design, Fashion Tech",
        description:
          "Tech-infused fashion experiences showcased through interactive web design elements.",
      },
      {
        img: "./img/0040.jpg",
        title: "Maxim Stark",
        tags: "Futuristic Wearables, Web Graphics",
        description:
          "Futuristic wearables and gear presented in a sleek, graphically rich web interface.",
      },
      {
        img: "./img/0041.jpg",
        title: "Pitcher",
        tags: "Innovative Textiles, Web Presentation",
        description:
          "Web presentation of innovative textiles that redefine the boundaries of modern fashion.",
      },
      {
        img: "./img/0042.jpg",
        title: "MindSpace",
        tags: "Augmented Reality, Fashion Design",
        description:
          "Augmented reality in fashion design, creating immersive web experiences for users.",
      },
      {
        img: "./img/0043.jpg",
        title: "The Athletix",
        tags: "Virtual Fashion, Graphic Design",
        description:
          "Virtual fashion collections displayed through stunning graphic design and web aesthetics.",
      },
      {
        img: "./img/0044.jpg",
        title: "All Work",
        tags: "Minimalist Aesthetics, Fashion Forward",
        description:
          "Fashion forward web design encapsulating the essence of minimalist aesthetics and innovation.",
      },
    ];
    document.addEventListener("DOMContentLoaded", function () {
  const container = document.querySelector(".container");
  const previewBg = document.querySelector(".preview-bg");
  const items = document.querySelectorAll(".item");
  let activePreview = document.querySelector(".preview.default");

  let isMouseOverItem = false;

  const defaultClipPaths = {
    "variant-1": "polygon(0% 100%, 100% 100%, 100% 100%, 0% 100%)",
    "variant-2": "polygon(100% 0, 100% 0, 100% 100%, 100% 100%)",
    "variant-3": "polygon(0% 0%, 0% 0%, 0% 100%, 0% 100%)",
  };

  const variantTransforms = {
    "variant-1": {
      title: { x: 75, opacity: 0 },
      tags: { y: -75, opacity: 0 },
      description: { x: -75, opacity: 0 },
    },
    "variant-2": {
      title: { x: -75, opacity: 0 },
      tags: { y: -75, opacity: 0 },
      description: { y: 75, opacity: 0 },
    },
    "variant-3": {
      title: { x: 75, opacity: 0 },
      tags: { y: 75, opacity: 0 },
      description: { x: 75, opacity: 0 },
    },
  };

  function getDefaultClipPath(previewElement) {
    for (const variant in defaultClipPaths) {
      if (previewElement.classList.contains(variant)) {
        return defaultClipPaths[variant];
      }
    }
    return "polygon(100% 0%, 0% 0%, 0% 100%, 100% 100%)";
  }

  function applyVariantStyles(previewElement) {
    const variant = previewElement.className
      .split(" ")
      .find((className) => className.startsWith("variant-"));
    if (variant && variantTransforms[variant]) {
      Object.entries(variantTransforms[variant]).forEach(
        ([elementClass, transform]) => {
          const element = previewElement.querySelector(
            `.preview-${elementClass}`
          );
          if (element) {
            gsap.set(element, transform);
          }
        }
      );
    }
  }

  function changeBg(newImgSrc) {
    const newImg = document.createElement("img");
    newImg.src = newImgSrc;
    newImg.style.position = "absolute";
    newImg.style.top = "0";
    newImg.style.left = "0";
    newImg.style.width = "100%";
    newImg.style.height = "100%";
    newImg.style.objectFit = "cover";
    newImg.style.opacity = "0";

    previewBg.appendChild(newImg);

    gsap.to(newImg, { opacity: 1, duration: 0.5 });

    if (previewBg.children.length > 1) {
      const oldImg = previewBg.children[0];
      gsap.to(oldImg, {
        opacity: 0,
        duration: 0.5,
        onComplete: () => {
          previewBg.removeChild(oldImg);
        },
      });
    }
  }

  previews.forEach((preview, index) => {
    const previewElement = document.createElement("div");
    previewElement.className = `preview ${mapClasses[index]} preview-${
      index + 1
    }`;
    previewElement.innerHTML = `
   <div class="preview-img"><img src="${preview.img}" alt=""/></div>
   <div class="preview-title"><h1>${preview.title}</h1></div>
   <div class="preview-tags"><p>${preview.tags}</p></div>
   <div class="preview-description"><p>${preview.description}</p></div>
 `;
    container.appendChild(previewElement);
    applyVariantStyles(previewElement);
  });

  items.forEach((item, index) => {
    item.addEventListener("mouseenter", () => {
      isMouseOverItem = true;
      const newBg = `./img/000${index + 1}.jpg`;
      changeBg(newBg);

      const newActivePreview = document.querySelector(`.preview-${index + 1}`);
      if (activePreview && activePreview !== newActivePreview) {
        const previousActivePreviewImg =
          activePreview.querySelector(".preview-img");
        const previousDefaultClipPath = getDefaultClipPath(activePreview);
        gsap.to(previousActivePreviewImg, {
          clipPath: previousDefaultClipPath,
          duration: 0.75,
          ease: "power3.out",
        });

        gsap.to(activePreview, {
          opacity: 0,
          duration: 0.3,
          delay: 0.2,
        });
        applyVariantStyles(activePreview, true);
      }
      gsap.to(newActivePreview, { opacity: 1, duration: 0.1 });
      activePreview = newActivePreview;

      const elementsToAnimate = ["title", "tags", "description"];
      elementsToAnimate.forEach((el) => {
        const element = newActivePreview.querySelector(`.preview-${el}`);
        if (element) {
          gsap.to(element, { x: 0, y: 0, opacity: 1, duration: 0.5 });
        }
      });

      const activePreviewImg = activePreview.querySelector(".preview-img");
      gsap.to(activePreviewImg, {
        clipPath: "polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)",
        duration: 1,
        ease: "power3.out",
      });
    });

    item.addEventListener("mouseleave", () => {
      isMouseOverItem = false;
      applyVariantStyles(activePreview, true);

      setTimeout(() => {
        if (!isMouseOverItem) {
          changeBg("./img/image001.jpg");
          if (activePreview) {
            gsap.to(activePreview, { opacity: 0, duration: 0.1 });
            const defaultPreview = document.querySelector(".preview.default");
            gsap.to(defaultPreview, { opacity: 1, duration: 0.1 });
            activePreview = defaultPreview;

            const activePreviewImg =
              activePreview.querySelector(".preview-img");
            const defaultClipPath = getDefaultClipPath(activePreview);
            gsap.to(activePreviewImg, {
              clipPath: defaultClipPath,
              duration: 1,
              ease: "power3.out",
            });
          }
        }
      }, 10);
    });
  });
});

    </script>
  </body>
</html>
