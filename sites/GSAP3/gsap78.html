<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSAP Intro / Text Effect</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Signika:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="gsap78.css" />
  </head>
  <body>
    <div class="menu">
      <div class="menu-item">
        <div class="menu-item-index">
          <p>01</p>
          <p>Why</p>
        </div>
        <div class="menu-link menu-link-main">
          <p>Why</p>
        </div>
        <div class="menu-link menu-link-hover">
          <p>Why</p>
        </div>
        <div class="menu-img">
          <img src="./img/0044.jpg" alt="">
        </div>
      </div>
      <div class="menu-item">
        <div class="menu-item-index">
          <p>02</p>
          <p>Who</p>
        </div>
        <div class="menu-link menu-link-main">
          <p>Who</p>
        </div>
        <div class="menu-link menu-link-hover">
          <p>Who</p>
        </div>
        <div class="menu-img">
          <img src="./img/0041.jpg" alt="">
        </div>
      </div>
      <div class="menu-item">
        <div class="menu-item-index">
          <p>03</p>
          <p>What</p>
        </div>
        <div class="menu-link menu-link-main">
          <p>What</p>
        </div>
        <div class="menu-link menu-link-hover">
          <p>What</p>
        </div>
        <div class="menu-img">
          <img src="./img/0040.jpg" alt="">
        </div>
      </div>
      <div class="menu-item">
        <div class="menu-item-index">
          <p>04</p>
          <p>How</p>
        </div>
        <div class="menu-link menu-link-main">
          <p>How</p>
        </div>
        <div class="menu-link menu-link-hover">
          <p>How</p>
        </div>
        <div class="menu-img">
          <img src="./img/0039.jpg" alt="">
        </div>
      </div>
      <div class="menu-item">
        <div class="menu-item-index">
          <p>05</p>
          <p>Join</p>
        </div>
        <div class="menu-link menu-link-main">
          <p>Join</p>
        </div>
        <div class="menu-link menu-link-hover">
          <p>Join</p>
        </div>
        <div class="menu-img">
          <img src="./img/0043.jpg" alt="">
        </div>
      </div>

      <div class="menu-close"><p>Close</p></div>
    </div>
    <div class="container">
      <div class="menu-open"><p>Menu</p></div>
    </div>
    <div class="copy">
      <p>Lifestyle Catalogue</p>
      <p>2024 / 2025</p>
    </div>
    <footer>
      <p>Launching Soon</p>
    </footer>

    <div class="slider">
      <div class="slide-active">
        <img src="./img/image001.jpg" alt="">
      </div>
      <div class="slide-next">
        <div class="slide-next-img">
          <img src="./img/image002.jpg" alt="">
        </div>
      </div>
    </div>

    <div class="slider-content">
      <div class="slider-content-active">
        <h1>LuminaPad</h1>
      </div>
      <div class="slider-content-next">
        <h1>PulseEar</h1>
      </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/CustomEase.min.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        gsap.registerPlugin(CustomEase);
        CustomEase.create(
          "hop",
          "M0,0 C0.091,0.543 0.148,0.662 0.277,0.786 0.405,0.909 0.596,0.979 1,1 "
        );

        const menuOpen = document.querySelector(".menu-open");
        const menuClose = document.querySelector(".menu-close");
        const menu = document.querySelector(".menu");
        const menuItems = document.querySelectorAll(".menu-item");
        let isMenuOpen = false;

        function splitTextIntoSpans(selector) {
          let elements = document.querySelectorAll(selector);
          elements.forEach((element) => {
            let text = element.innerText;
            let splitText = text
              .split("")
              .map(function (char) {
                return `<span>${char === " " ? "&nbsp;&nbsp;" : char}</span>`;
              })
              .join("");
            element.innerHTML = splitText;
          });
        }

        splitTextIntoSpans(".menu-link p");

        gsap.set(".menu-close p", { y: 40 });
        gsap.set(".menu-link p span", { y: 250 });

        const handleMenu = () => {
          gsap.to(menu, {
            width: isMenuOpen ? "20vw" : "100vw",
            duration: 1,
            ease: "hop",
          });

          gsap.to(".menu-item", {
            justifyContent: isMenuOpen ? "center" : "flex-start",
            duration: 1,
            ease: "power3.out",
          });

          gsap.to(".menu-item-index", {
            alignItems: isMenuOpen ? "center" : "flex-start",
            duration: 1,
            ease: "power3.out",
            onComplete: () => {
              isMenuOpen = !isMenuOpen;
              menuItems.forEach((menuItem) => {
                if (isMenuOpen) {
                  menuItem.classList.add("menu-opened");
                } else {
                  menuItem.classList.remove("menu-opened");
                }
              });
            },
          });

          gsap.to(".menu-close p", {
            y: isMenuOpen ? 40 : 0,
            duration: 1,
            ease: "power3.out",
          });

          gsap.to(".menu-open p", {
            y: isMenuOpen ? 0 : -40,
            duration: 1,
            ease: "power3.out",
          });

          menuItems.forEach((menuItem) => {
            const menuItemLetters =
              menuItem.querySelectorAll(".menu-link p span");
            gsap.to(menuItemLetters, {
              delay: isMenuOpen ? 0 : 0.25,
              y: isMenuOpen ? 250 : 0,
              duration: 1,
              stagger: isMenuOpen ? -0.075 : 0.075,
              ease: "power3.out",
            });
          });
        };

        menuOpen.addEventListener("click", handleMenu);
        menuClose.addEventListener("click", handleMenu);
      });

      // SLider
      const sliderContent =[
        'LuminaPad',
        'PulseEar',
        'ZenithWatch',
        'AeroCharge',
        'NimbusCam',
      ];

      let currentImageIndex =2;
      let currentContentIndex = 1;
      const totalImages = 5;
      let isAnimating = false;

      function splitTextIntoSpans(selector){
        let elements = document.querySelectorAll(selector);
        elements.forEach((element) =>{
          let text = element.innerText;
          let splitText = text
          .split('')
          .map(function (char){
            return `<span>${char === '' ? '&nbsp;&nbsp;' : char}</span>`;
          })
          .join('');
          element.innerHTML = splitText;
        });
      }

      gsap.to('.slide-next-img',{
        clipPath: 'polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)',
        duration: 1.5,
        ease: 'power3.out',
        delay: 1,
      });

      document.addEventListener('click', function (){
        if (isAnimating) return;

        isAnimating = true;

        splitTextIntoSpans('.slider-content-active h1');
        gsap.to('.slide-active img',{
          scale: 2,
          duration: 2,
          ease: 'power3.out',
        });

        gsap.to('.slider-content-active h1 span',{
          top: '-175px',
          stagger: 0.05,
          ease: "power3.out",
          duration: 0.5,
          onComplete: () =>{
            gsap.to('.slider-content-active',{
              top:'-175px',
              duration: 0.25,
              ease: 'power3.out',
            });
          },
        });

        splitTextIntoSpans('.slider-content-next h1');
        gsap.set('.slider-content-next h1 span', {top: '200px'});

        gsap.to('.slider-content-next',{
          top: '0',
          duration: 1.125,
          ease: 'power3.out',
          onComplete: function () {
            document.querySelector('.slider-content-active').remove();
            gsap.to('.slider-content-next h1 span',{
              top: 0,
              stagger: 0.05,
              ease: 'power3.out',
              duration: 0.5,
            });

            const nextContent = document.querySelector('.slider-content-next');
            nextContent.classList.remove('slider-content-next');
            nextContent.classList.add('slider-content-active');
            nextContent.style.top = '0';

            currentContentIndex = (currentContentIndex + 1) % totalImages;
            const nextContentText = sliderContent[currentContentIndex];
            const newContentHTML = `<div class='slider-content-next' style='top: 200px;'><h1>${nextContentText}</h1></div>`
            document.querySelector('.slider-content')
            .insertAdjacentHTML('beforeend', newContentHTML);
          },
        });

        currentImageIndex = (currentImageIndex % totalImages) + 1;

        const newSlideHTML = `
        <div class='slide-next'>
          <div class='slide-next-img'>
            <img src='./img/image00${currentImageIndex}.jpg'/>
          </div>
        </div>
        `;

        document.querySelector('.slider')
        .insertAdjacentHTML('beforeend', newSlideHTML);
        gsap.to(".slider .slide-next:last-child .slide-next-img", {
        clipPath: "polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)",
        duration: 1.5,
        ease: "power3.out",
        delay: 0.5,
      });

      const slideNextImg = document.querySelector(".slide-next-img");
      gsap.to(slideNextImg, {
        width: "80vw",
        height: "100vh",
        duration: 2,
        ease: "power3.out",
        onComplete: function () {
          const currentActiveSlide = document.querySelector(".slide-active");
          if (currentActiveSlide) {
            currentActiveSlide.parentNode.removeChild(currentActiveSlide);
          }

          const nextSlide = document.querySelector(".slide-next");
          if (nextSlide) {
            nextSlide.classList.remove("slide-next");
            nextSlide.classList.add("slide-active");

            const nextSlideImg = nextSlide.querySelector(".slide-next-img");
            if (nextSlide) {
              nextSlideImg.classList.remove("slide-next-img");
            }
          }

          setTimeout(() => {
            isAnimating = false;
          }, 500);
        },
      });

      });
    </script>
  </body>
</html>
