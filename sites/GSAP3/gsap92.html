<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSAP Landing Page Reveal</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.min.css"/>
  <link rel="stylesheet" href="gsap92.css"> 
</head>
<body>
  <div class="hero">
    <div class="progress-bar">
      <p>loading</p>
      <p>/<span id="counter">0</span></p>
    </div>
    <div class="video-container">
      <video autoplay loop muted playsinline>
        <source src="./img/vid01.mp4" type="video/mp4">
      </video>
    </div>
    <nav>
      <p>&#9679;</p>
      <p>&#9679;</p>
    </nav>
    <footer>
      <p>ufc</p>
      <p>podcasts</p>
      <p>betting</p>
      <p>rankings</p>
      <p>news</p>
    </footer>
    <div class="header">
      <h1><span>Combat from</span></h1>
      <h1><span>the streets of</span></h1>
      <h1><span>Kansas</span></h1>
      <p><span>( watch the fight )</span></p>
    </div>
    <div class="coordinates">
      <p><span>37.6934&#176; N</span></p>
      <p><span>97.3382&#176; W</span></p>
    </div>
  </div>
  <div class="logo">
    <div class="char"><h1>C</h1></div>
    <div class="char anim-out"><h1>l</h1></div>
    <div class="char anim-out"><h1>a</h1></div>
    <div class="char anim-out"><h1>s</h1></div>
    <div class="char anim-out"><h1>h</h1></div>
    <div class="char anim-out"><h1>o</h1></div>
    <div class="char anim-out"><h1>n</h1></div>
    <div class="char anim-in"><h1>.</h1></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.0/CustomEase.min.js"></script>
  <script>
    gsap.registerPlugin(CustomEase);
    const customEase = CustomEase.create('custom', '.87,0,.13,1');
    const counter = document.getElementById('counter');

    gsap.set('.video-container',{
      scale: 0,
      rotation: -20,
    });
    gsap.to('.hero',{
      clipPath: 'polygon(0% 45%, 25% 45%, 25% 55%, 0% 55%)',
      duration: 1.5,
      ease: customEase,
      delay: 1
    });
    gsap.to('.hero',{
      clipPath: 'polygon(0% 45%, 100% 45%, 100% 55%, 0% 55%)',
      duration: 2,
      ease: customEase,
      delay: 3,

      onStart: () =>{
        gsap.to('.progress-bar',{
          width: '100vw',
          duration: 2,
          ease: customEase,
        });
        gsap.to(counter,{
          innerHTML: 100,
          duration: 2,
          ease: customEase,
          snap: {innerHTML: 1},
        });
      },
    });

    gsap.to('.hero',{
      clipPath: 'polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)',
      duration: 1,
      ease: customEase,
      delay: 5,
      onStart: () =>{
        gsap.to('.video-container',{
          scale: 1,
          rotation: 0,
          clipPath: 'polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)',
          duration: 1.25,
          ease: customEase,
        });

        gsap.to('.progress-bar',{
          opacity: 0,
          duration: 0.3,
        });

        gsap.to('.logo',{
          left: '0%',
          transform: 'translateX(0%)',
          duration: 1.25,
          ease: customEase,

          onStart: () =>{
            gsap.to('.char.anim-out h1',{
              y: '100%',
              duration: 1,
              stagger: -0.075,
              ease: customEase,
            });

            gsap.to('.char.anim-in h1',{
              x: '-1200%',
              duration: 1,
              ease: customEase,
              delay: 0.25,
            })
          },
        })
      }, 
    });

    gsap.to(['.header span', '.coordinates span'],{
      y: '0%',
      duration: 1,
      stagger: 0.125,
      ease: 'power3.out',
      delay: 5.75,
    })
  </script>
</body>
</html>
