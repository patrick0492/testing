<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSAP Horizontal scroll | Reveal</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Signika:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="gsap75.css">
  </head>
  <body>
    <div class="loader">
      <div class="img">
        <img src="./img/image001.jpg" alt="">
      </div>
      <div class="img">
        <img src="./img/image002.jpg" alt="">
      </div>
      <div class="img">
        <img src="./img/image003.jpg" alt="">
      </div>
      <div class="img">
        <img src="./img/image004.jpg" alt="">
      </div>
      <div class="img">
        <img src="./img/image005.jpg" alt="">
      </div>
      <div class="img">
        <img src="./img/ls001.jpg" alt="">
      </div>
      <div class="img">
        <img src="./img/ls002.jpg" alt="">
      </div>
    </div>
    <div class="overlay">
      <div class="col">
        <h2><div>A portuguese</div></h2>
        <h2><div>visual photographer</div></h2>
        <h2><div>based in spain</div></h2>
      </div>
      <div class="col">
        <h2><div><span>click</span> anywhere to continue</div></h2>
      </div>
    </div>
    <div class="container">
      <nav>
        <a href="#!">Codegrid</a>
      </nav>
      <section class="wrapper-404">
        <h1>Page Not Found</h1>
        <div class="card" id="card-1">
          <img src="./img/0040.jpg" alt="">
        </div>
        <div class="card" id="card-2">
          <img src="./img/0041.jpg" alt="">
        </div>
        <div class="card" id="card-3">
          <img src="./img/0042.jpg" alt="">
        </div>
        <div class="card" id="card-4">
          <img src="./img/0043.jpg" alt="">
        </div>
      </section>
      <section class="outro">
        <h1>
          This page doesn't exist anymore... but that's okay. <br>
          We'll get you right back on the track
        </h1>
      </section>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script>
      gsap.from('h2 div', 1.5,{
        yPercent: 100,
        ease: 'power4.inOut',
        stagger: {
          amount: 0.5,
        },
      });

      gsap.to('h2', 1.5,{
        clipPath: 'polygon(0 0, 100% 0, 100% 100%, 0 100%)',
        ease: 'power4.inOut',
        stagger: {
          amount: 0.5,
        },
      });

      document.addEventListener('DOMContentLoaded', function (){
        let overlay = document.querySelector('.overlay');
        overlay.addEventListener('click', function (){
          gsap.to('h2 div', 1.5,{
            yPercent: -100,
            ease: 'power4.inOut',
            stagger:{
              amount: 0.5,
            },
          });
          gsap.to('h2', 1.5,{
            clipPath: 'polygon(0% 85%, 100% 85%, 100% 100%, 0% 100%)',
            ease: 'power4.inOut',
            stagger: {
              amount: 0.5,
            },
          },0);

          gsap.to('.overlay', 2,{
            clipPath: 'polygon(0% 0%, 100% 0%, 100% 0%, 0% 0%)',
            ease: 'power4.inOut',
          });

          gsap.to('.img', 2,{
            clipPath: 'polygon(0% 100%, 100% 100%, 100% 0%, 0% 0%',
            ease: 'power4.inOut',
            stagger: {
              amount: 1.5,
            },
          });

          gsap.to('.loader', 2,{
            clipPath: 'polygon(0% 0%, 100% 0%, 100% 0%, 0% 0%)',
            ease: 'power4.inOut',
            delay: 2,
          });
        });
      });

      // Horizontal scroll
      gsap.registerPlugin(ScrollTrigger);

      document.addEventListener('DOMContentLoaded', function (){
        const cards = [
          {id: '#card-1', endTranslateX: -2000, rotate: 45},
          {id: '#card-2', endTranslateX: -1000, rotate: -30},
          {id: '#card-3', endTranslateX: -2000, rotate: 45},
          {id: '#card-4', endTranslateX: -1500, rotate: -30},
        ];

        ScrollTrigger.create({
          trigger: '.wrapper-404',
          start: 'top top',
          end: '+=900vh',
          scrub: 1,
          pin: true,
          onUpdate: (self) =>{
            gsap.to('.wrapper-404',{
              x: `${-350 * self.progress}vw`,
              duration: 0.5,
              ease: 'power3.out',
            });
          },
        });

        cards.forEach((card) =>{
          ScrollTrigger.create({
            trigger: 'card.id',
            start: 'top top',
            end: '+=1200vh',
            scrub: 1,
            onUpdate: (self) =>{
              gsap.to(card.id,{
                x: `${card.endTranslateX * self.progress}px`,
                rotate: `${card.rotate * self.progress * 2}`,
                duration: 0.5,
                ease: 'power3.out'
              })
            }
          })
        })
      });
    </script>
  </body>
</html>
