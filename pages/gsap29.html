<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSAP</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.7.1/gsap.min.js"></script>
  <link rel="stylesheet" href="gsap29.css">
</head>
<body>
  <header>
    <div class="logo">Patrick Online</div>
    <div class="menu-open" onclick="menuOpen()">
      <i class="fa fa-bars"></i>
    </div>
  </header>

  <div class="menu-container">
    <div class="menu-close" onclick="menuClose()">
      <i class="fa fa-close"></i>
    </div>
    <div class="menu-items">
      <div class="menu-items-container">
        <span>
          <div class="menu-item">
            <div class="menu-item-number">01</div>
            <div class="menu-item-name">Home</div>
            <div class="menu-item-sub">Briefly about the main thing</div>
            <div class="menu-item-icon">
              <i class="fa fa-arrow-circle-o-up"></i>
            </div>
          </div>
        </span>
        <div class="line"></div>
        <span>
          <div class="menu-item">
            <div class="menu-item-number">02</div>
            <div class="menu-item-name">About</div>
            <div class="menu-item-sub">A story about people</div>
            <div class="menu-item-icon">
              <i class="fa fa-arrow-circle-o-up"></i>
            </div>
          </div>
        </span>
        <div class="line"></div>
        <span>
          <div class="menu-item">
            <div class="menu-item-number">03</div>
            <div class="menu-item-name">Vision</div>
            <div class="menu-item-sub">Philosophy of work</div>
            <div class="menu-item-icon">
              <i class="fa fa-arrow-circle-o-up"></i>
            </div>
          </div>
        </span>
        <div class="line"></div>
        <span>
          <div class="menu-item">
            <div class="menu-item-number">04</div>
            <div class="menu-item-name">Projects</div>
            <div class="menu-item-sub">Our practical experience</div>
            <div class="menu-item-icon">
              <i class="fa fa-arrow-circle-o-up"></i>
            </div>
          </div>
        </span>
        <div class="line"></div>
        <span>
          <div class="menu-item">
            <div class="menu-item-number">05</div>
            <div class="menu-item-name">Contact</div>
            <div class="menu-item-sub">Stay in touch with us</div>
            <div class="menu-item-icon">
              <i class="fa fa-arrow-circle-o-up"></i>
            </div>
          </div>
        </span>
        <div class="line"></div>
      </div>
    </div>
  </div>

  <div class="bg-image">
    <div class="image"></div>
    <p>i vibe different</p>
  </div>

  <div class="containerr">
    <h1>DRIPP.</h1>
  </div>
  
  <script>
    const tl1 = gsap.timeline();
    tl1.from('.bg-image',{
      opacity: 0,
    });
    tl1.to('.image',{
      delay: .5,
      y: 0,
      duration: 0.8,
    })
    tl1.from('.logo, .menu-open',{
      duration: 1,
      y: -100,
      opacity: 0,
      stagger:{
        amount: 0.4,
      },
    });
    tl1.to('.containerr h1',{
      opacity: 1,
      letterSpacing: '-25px',
      duration: 1.2,
    },'-=.7');
    tl1.to('.bg-image',{
      overflow: 'visible',
    })
    const tl = gsap.timeline({
      paused: 'true',
    });

    tl.to('.menu-container',{
      duration: 1,
      x: 0,
    });
    tl.from('.menu-close',{
      opacity: 0,
      rotate: '180deg',
    },'-=.2');
    tl.from('.line',{
      duration: 1,
      stagger: {
        amount: 0.5,
      },
      width: '0%',
    },'-=.2');
    tl.from('.menu-item-number',{
      duration: 1,
      stagger:{
        amount: .5,
      },
      y: 100,
    },'-=1.5');
    tl.from('.menu-item-name',{
      duration: 1,
      stagger:{
        amount: .5,
      },
      y: 100,
    },'-=1.3');
    tl.from('.menu-item-sub',{
      duration: 1,
      stagger:{
        amount: .5,
      },
      y: 100,
    },'-=1.1');
    tl.from('.menu-item-icon',{
      duration: 1,
      stagger:{
        amount: .5,
      },
      y: 100,
    },'-=1');

    function menuOpen(){
      tl.play();
    }
    function menuClose(){
      tl.reverse();
    }
  </script>
</body>
</html>
