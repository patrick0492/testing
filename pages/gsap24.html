<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.1/css/all.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.6.0/gsap.min.js"></script>
  <title>Gsap Animation</title>
  <link rel="stylesheet" href="gsap24.css">
</head>
<body>
  <div class="hamburger">
    <a href="#" class="hclose">Close</a>
    <ul>
      <li class="L1"><a href="#">Store</a></li>
      <li class="L2"><a href="#">Create</a></li>
      <li class="L3"><a href="#">Ride</a></li>
      <div class="himg bg1"></div>
      <div class="himg bg2"></div>
      <div class="himg bg3"></div>
    </ul>
  </div>

  <div class="soverlay">
    <div class="cross"></div>
    <div class="searchbox">
      <input type="text" placeholder="Search...">
      <a href="#" class="img"><i class="fa fa-search"></i></a>
    </div>
  </div>

  <div class="container">
    <div class="nav">
      <div class="menu">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <div class="horiMenu">
        <ul>
          <li><a href="#">Buy</a></li>
          <li><a href="#">Blog</a></li>
          <li><a href="#">Help</a></li>
          <li><a href=""><span></span></a></li>
          <li><a href="#">Facebook</a></li>
        </ul>
      </div>
    </div>
    <div class="wrapper">
      <header>
        <div class="hbtn">
          <a href="#">Home</a>
        </div>
        <div class="search">
          <div class="icon"><i class="fa fa-search"></i></div>
        </div>
      </header>
      <div class="heading">
        <h1>FEEL THE <span>RIDE</span></h1>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Eum, illum</p>
        <a href="#">Read more</a>
      </div>
    </div>
  </div>
  
  <script>
    // intro
    var wh = gsap.timeline({defaults:{ease:Expo.easeInOut}});
    wh.from('.container',2,{
      x: innerWidth * 1,
    })
    wh.from('.nav',1,{
      x: innerWidth * -1,
    })
    wh.from('.menu',1,{
      y: innerWidth * -1,
    })
    wh.from('.menu span',{
      x:innerWidth * -1,
      stagger: .15
    })
    wh.from('.horiMenu ul li a',{
      x: -200,
      stagger: .15
    })
    wh.from('.horiMenu ul li a span',{
      height: '0px',
    },'-=.001')
    wh.from('.heading h1',2,{
      x: innerWidth * -1,
    })
    wh.from('.heading p',1,{
      x: innerWidth * -1,
    },'-=.7')
    wh.from('.heading a',{
      x: innerWidth * -1,
    },'-=.7')
    wh.from('.hbtn',{
      y: innerWidth * -1,
    })
    wh.from('.icon',.5,{
      scale: 0,
    },'-=.3')

    // search
    let searchSection = document.querySelector('.soverlay')
    let close = document.querySelector('.cross')
    let searchIcon = document.querySelector('.search')

    var tl = gsap.timeline({defaults:{ease:Expo.easeInOut}});
    tl.paused(true);
    tl.to('.icon',1,{
      scale: 3
    })
    tl.to(searchSection,{
      clipPath: 'circle(128.4% at 90% 8%)',
      zIndex: '9999'
    },'-=.7')
    tl.from('input',{
      x:-200,
      opacity: 0
    },'start')
    tl.from('.img',{
      x: 200,
      opacity: 0
    },'start')
    searchIcon.addEventListener('click', () =>{
      tl.play()
    })
    close.addEventListener('click', () =>{
      tl.reverse()
    })

    // for hamburger
    let hamburgerOpen = document.querySelector('.menu');
    let hamburgerClose = document.querySelector('.hclose');

    var tl2 = gsap.timeline({paused: true});
    tl2.to('.hamburger',1,{
      x: '0%',
      ease: Expo.easeInOut
    })
    tl2.fromTo('.hamburger li',{
      y: '100%',
      opacity: 0
    },{
      duration: .5,
      opacity: 1,
      y: '0%',
      stagger: 0.25,
    })

    hamburgerOpen.addEventListener('click', () =>{
      tl2.play()
    })
    hamburgerClose.addEventListener('click', () =>{
      tl2.reverse()
    })
  </script>
</body>
</html>
