<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSAP</title>
  <link rel="stylesheet" href="gsap25.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.7.1/gsap.min.js"></script>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
  <header>
    <div class="img">
      <i class="fa fa-globe"></i>
    </div>
    <div class="heading">
      ART GALLERY
    </div>
    <div class="menu">
      <i class="fa fa-bars"></i>
    </div>
  </header>
  <div class="container">
    <div class="inner-container inner-container-1">
      <div class="inner-inner-container">
        <div class="top-section">
          <h1>The <br>night <br> watch</h1>
          <p>MDCLIIX</p>
        </div>
        <div class="bottom-section">1</div>
      </div>
    </div>
    <div class="inner-container inner-container-2">
      <div class="inner-inner-container">
        <div class="top-section">
          <h1>The <br> kitchen <br> maid</h1>
          <p>MDCLI</p>
        </div>
        <div class="bottom-section">2</div>
      </div>
    </div>
    <div class="inner-container inner-container-3">
      <div class="inner-inner-container">
        <div class="top-section">
          <h1>The <br> artist in <br> studio</h1>
          <p>MDCVXX</p>
        </div>
        <div class="bottom-section">3</div>
      </div>
    </div>
    <div class="inner-container inner-container-4">
      <div class="inner-inner-container">
        <div class="top-section">
          <h1>Titus <br> as a <br> monk</h1>
          <p>MDCXII</p>
        </div>
        <div class="bottom-section">4</div>
      </div>
    </div>
  </div>
  
  <!-- .li$.li*4>a.a$ voor vier li met opvolgende classnummers plus links met hetzelfde -->
  <!-- divname>divname>flexone+.flextwo -->
  <script>
    const tl = gsap.timeline();
    tl.from('.img, .heading, .menu, h1, p, .bottom-section',{
    duration: 1,
    y: 200,
    opacity: 0,
    stagger: {
      amount: .5,
      },
    })
  </script>
</body>
</html>
