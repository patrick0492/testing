<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSAP landing Slider</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="gsap91.css">
</head>
<body>
  <section class="sticky">
    <div class="slider">
      <div class="slides">
        <div class="slide">
          <div class="img">
            <img src="./img/ls02.jpg" alt="">
          </div>
          <div class="title">
            <h1>Practical Luxury<br>Smart Living</h1>
          </div>
        </div>
        <div class="slide">
          <div class="img">
            <img src="./img/ls01.jpg" alt="">
          </div>
          <div class="title">
            <h1>Refined Reception<br>Lasting Impact</h1>
          </div>
        </div>
        <div class="slide">
          <div class="img">
            <img src="./img/ls03.jpg" alt="">
          </div>
          <div class="title">
            <h1>Modern Concrete<br>Warm Details</h1>
          </div>
        </div>
        <div class="slide">
          <div class="img">
            <img src="./img/ls04.jpg" alt="">
          </div>
          <div class="title">
            <h1>Cuved Elements<br>Modern Flow</h1>
          </div>
        </div>
        <div class="slide">
          <div class="img">
            <img src="./img/ls05.jpg" alt="">
          </div>
          <div class="title">
            <h1>Minimal Design<br>Natural Light</h1>
          </div>
        </div>
      </div>
    </div>
  </section>
  <section class="outro">
    <h1>Shaping timeless spaces with contemporary vision</h1>
    <svg xmlns="'http://www.w3.org/2000/svg" viewBox="0 0 800 400">
      <defs>
        <path id="path" d="M50 200 C150 50 250 350 400 200 C550 50 650 350 750 200" stroke="#fff" fill="none"/>
      </defs>
      <text fill="#fff">
        <textPath id="text" xlink:href="#path">
          Flowing <tspan fill="#e74c3c">Wave</tspan> motion in a compact design
        </textPath>
      </text>
    </svg>
    <button id="action">Let's Animate!</button>
  </section>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.1/dist/lenis.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () =>{
      gsap.registerPlugin(ScrollTrigger);

      const lenis = new Lenis();
      lenis.on('scroll', ScrollTrigger.update);
      gsap.ticker.add((time) =>{
        lenis.raf(time * 1000);
      });
      gsap.ticker.lagSmoothing(0);

      const stickySection = document.querySelector('.sticky');
      const slidesContainer = document.querySelector('.slides');
      const slider = document.querySelector('.slider');
      const slides = document.querySelectorAll('.slide');

      const stickyHeight = window.innerHeight * 6;
      const totalMove = slidesContainer.offsetWidth - slider.offsetWidth;
      const slideWidth = slider.offsetWidth;

      slides.forEach((slide) =>{
        const title = slide.querySelector('.title h1');
        gsap.set(title, {y: -200});
      });

      let currentVisibleIndex = null;

      const observer = new IntersectionObserver(
        (entries) =>{
          entries.forEach((entry) =>{
            const currentIndex = Array.from(slides).indexOf(entry.target);
            const titles = Array.from(slides).map((slide) => slide.querySelector('.title h1'));

            if (entry.intersectionRatio >= 0.25){
              currentVisibleIndex = currentIndex;
              titles.forEach((title, index) =>{
                gsap.to(title,{
                  y: index === currentIndex ? 0 : -200,
                  duration: 0.5,
                  ease: 'power2.out',
                  overwrite: true,
                });
              });
            } else if(
              entry.intersectionRatio < 0.25 && currentVisibleIndex === currentIndex
            ){
              const prevIndex = currentIndex - 1;
              currentVisibleIndex = prevIndex >= 0 ? prevIndex : null;

              titles.forEach((title, index) =>{
                gsap.to(title, {
                  y: index === prevIndex ? 0 : -200,
                  duration: 0.5,
                  ease: 'power2.out',
                  overwrite: true,
                });
              });
            }
          });
        },{
          root: slider,
          threshold: [0, 0.25],
        }
      );

      slides.forEach((slide) => observer.observe(slide));

      ScrollTrigger.create({
        trigger: stickySection,
        start: 'top top',
        end: `+=${stickyHeight}px`,
        scrub: 1,
        pin: true,
        pinSpacing: true,
        onUpdate: (self) =>{
          const progress = self.progress;
          const mainMove = progress * totalMove;

          gsap.set(slidesContainer,{
            x: -mainMove,
          });

          const currentSlide = Math.floor(mainMove / slideWidth);
          const sliderProgress = (mainMove % slideWidth) / slideWidth;

          slides.forEach((slide, index) =>{
            const image = slide.querySelector('img');
            if (image){
              if (index === currentSlide || index === currentSlide + 1){
                const relativeProgress = index === currentSlide ? sliderProgress : sliderProgress - 1;
                const parallaxAmount = relativeProgress * slideWidth * 0.25;
                gsap.set(image,{
                  x: parallaxAmount,
                  scale: 1.35,
                });
              } else{
                gsap.set(image,{
                  x: 0,
                  scale: 1.35,
                })
              }
            }
          })
        },
      });
    });
    var dur = 2.5
    const tl = gsap.timeline();
    document.querySelector('#action').addEventListener('click', animateText);

    tl.from('#text', dur,{
      attr: {startOffset: '100%'},
      ease: 'power1',
    });
    tl.reversed(true);

    function animateText(){
      tl.reversed(!tl.reversed());
    };
  </script>
</body>
</html>
