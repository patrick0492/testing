<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSAP</title>
  <link rel="stylesheet" href="gsap15.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.6.0/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.7.1/ScrollTrigger.min.js"></script>
</head>
<body>
  <div id="back">
    <nav>
      <div class="links">
        <a href="#">Home</a><a href="#">Services</a>
      </div>
      <div class="logo">
        <div class="logo-circle">S</div>
        <div class="logo-text">Spain Collection</div>
        <div class="logo-subtext">España & Portugal</div>
      </div>

      <div class="links">
        <a href="#">Pricing</a>
        <a href="#">About</a>
      </div>
    </nav>

    <h1>
      Spain Collection is your expert partner for deluxe <br>bespoke travel experiences in
    </h1>

    <div id="main">
      <div class="image image1"></div>
      <div class="imgholder imgholder1">
        <div class="image image2"></div>
        <div class="image image3"></div>
      </div>
      <div id="videoplayer">
        
      </div>
      <div class="imgholder imgholder2">
        <div class="image image4"></div>
        <div class="image image5"></div>
      </div>
      <div class="image image6"></div>
    </div>
  </div>
  
  <script>
    gsap.to('#videoplayer',{
      scrollTrigger: {
        trigger: '#main',
        start: 'top top',
        scrub: 3,
        pin: '#main'
      },
      width: '100%',
    })
    gsap.to('.image1',{
      scrollTrigger: {
        trigger: '#main',
        start: 'top top',
        scrub: 3
      },
      left: '-600px',
      opacity: 0
    })
    gsap.to('.imgholder1',{
      scrollTrigger: {
        trigger: '#main',
        start: 'top top',
        scrub: 3
      },
      left: '-260px',
      opacity: 0
    })
    gsap.to('.image6',{
      scrollTrigger: {
        trigger: '#main',
        start: 'top top',
        scrub: 3
      },
      right: '-600px',
      opacity: 0
    })
    gsap.to('.imgholder2',{
      scrollTrigger: {
        trigger: '#main',
        start: 'top top',
        scrub: 3
      },
      right: '-260px',
      opacity: 0
    })
  </script>
</body>
</html>
