<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSAP Menu</title>
  <link rel="stylesheet" href="gsap01.css">
</head>
<body>
  <div class="menu-btn" onclick="toggle()">
    <span></span>
    <span></span>
  </div>
  <div class="content">
    <span>Menu</span>
    <h1>Click the lines</h1>
  </div>
  <div class="img-divs">
    <div class="div1"></div>
    <div class="div2"></div>
    <div class="div3"></div>
  </div>

  <div class="menu">
    <div class="menu-btn active" onclick="togglerev()">
      <span></span>
      <span></span>
    </div>
    <div class="showcase">
      <div class="hover1"></div>
      <div class="hover2"></div>
      <div class="hover3"></div>
      <div class="hover4"></div>
    </div>
    <div class="page-links">
      <ul class="ul">
        <div class="li1 li"><a href="" class="a1">Home</a></div>
        <div class="li2 li"><a href="" class="a2">Collection</a></div>
        <div class="li3 li"><a href="" class="a3">Journal</a></div>
        <div class="li4 li"><a href="" class="a4">Contact</a></div>
      </ul>
    </div>
    <div class="social-links">
      <ul class="ul">
        <li>Facebook .</li>
        <li>Twitter .</li>
        <li>Snapchat .</li>
        <li>Linkedin .</li>
      </ul>
    </div>
  </div>
  <!-- .li$.li*4>a.a$ voor vier li met opvolgende classnummers plus links met hetzelfde -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.7.1/gsap.min.js"></script>
  <script>
    var tl1 = gsap.timeline();
    tl1.from('.content',{
      duration: 2,
      opacity: 1,
      skewY: '10%',
      x: '5%',
      stagger:{
        amount: .4
      }
    });
    tl1.from('.img-divs',{
      duration: .5,
      opacity: 0,
      y: '5%',
      stagger:{
        amount: .4
      }
    });

    var tl = gsap.timeline(
      {
        paused: 'true'
      }
    );

    tl.to('.menu',{
      duration: .5,
      y: '0%',
      opacity: 1
    })
    tl.from('.ul',{
      duration: .5,
      y: '-20%',
      opacity: 0,
      stagger:{
        amount: .4
      }
    });
    tl.from('.showcase',{
      duration: 1,
      x: '-4%',
      opacity: 0,
      stagger: {
        amount: .4
      }
    });
    function toggle(){
      tl.play();
    }
    function togglerev(){
      tl.reverse();
    }
  </script>
</body>
</html>
