<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSAP Landing</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="gsap90.css">
</head>
<body>
  <div class="container">
    <div class="revealers">
      <div class="revealer r-1"></div>
      <div class="revealer r-2"></div>
    </div>
    <div class="images">
      <div class="img"><img src="img/ls01.jpg" alt=""></img></div>
      <div class="img"><img src="img/ls06.jpg" alt=""></img></div>
      <div class="img"><img src="img/ls03.jpg" alt=""></img></div>
      <div class="img"><img src="img/ls04.jpg" alt=""></img></div>
      <div class="img"><img src="img/ls05.jpg" alt=""></img></div>
      <div class="img main"><img src="img/ls02.jpg" alt=""></img></div>
      <div class="img main"><img src="img/ls07.jpg" alt=""></img></div>
      <div class="img main"><img src="img/ls08.jpg" alt=""></img></div>
    </div>
    <div class="hero-content">
      <div class="site-logo">
        <div class="word"><h1>Arc</h1></div>
        <div class="word"><h1>Worldwide<sup>&copy;</sup></h1></div>
      </div>
      <div class="nav">
        <div class="nav-item"><p>About</p></div>
        <div class="nav-item"><p>Work</p></div>
        <div class="nav-item"><p>Journal</p></div>
        <div class="nav-item"><p>Contact</p></div>
      </div>
      <div class="cover-img">
        <img src="./img/ls08.jpg" alt="">
      </div>
      <div class="site-info">
        <div class="row">
          <div class="col">
            <div class="line"><p>Featured Works</p></div>
          </div>
          <div class="col">
            <h2>Arc is a contemporary fashion brand redefining elegance with timeless designs and innovative aesthetics</h2>
          </div>
        </div>
        <div class="row">
          <div class="col"></div>
          <div class="col">
            <div class="address">
              <div class="line"><p>Arc Studio</p></div>
              <div class="line"><p>Riverstone Building</p></div>
              <div class="line"><p>- 28 Orchard Lane</p></div>
              <div class="line"><p>N1 4DX</p></div>
            </div>
            <div class="socials">
              <div class="line"><p>SayHi@Arc.com</p></div>
              <div class="line"><p>Instagram</p></div>
              <div class="line"><p>LinkedIn</p></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Flip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/CustomEase.min.js"></script>
  <script src="https://unpkg.com/split-type"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () =>{
      CustomEase.create(
        'hop',
        'M0,0 C0.355,0.022 0.448,0.079 0.5,0.5 0.542,0.846 0.615,1 1,1'
      );
      CustomEase.create(
        'hop',
        'M0,0 C0.355,0.022 0.448,0.079 0.5,0.5 0.542,0.846 0.615,1 1,1'
      );
      CustomEase.create(
        'hop2',
        'M0,0 C0.078,0.617 0.114,0.716 0.255,0.828 0.373,0.922 0.561,1 1,1'
      );

      const splitH2 = new SplitType('.site-info h2',{
        types: 'lines',
      });

      splitH2.lines.forEach((line) =>{
        const text = line.textContent;
        const wrapper = document.createElement('div');
        wrapper.className = 'line';
        const span = document.createElement('span');
        span.textContent = text;
        wrapper.appendChild(span);
        line.parentNode.replaceChild(wrapper, line);
      });

      const mainTl = gsap.timeline();
      const revealerTl = gsap.timeline();
      const scaleTl = gsap.timeline();
  
      revealerTl.to('.r-1',{
        clipPath: 'polygon(0% 0%, 100% 0%, 100% 0%, 0% 0%)',
        duration: 1.5,
        ease: 'hop'
      })
      .to('.r-2',{
        clipPath: 'polygon(0% 100%, 100% 100%, 100% 100%, 0% 100%)',
        duration: 1.5,
        ease: 'hop'
      },'<');
      scaleTl.to('.img:first-child',{
        scale: 1,
        duration: 2, 
        ease: 'power4.inOut',
      });

      const images = document.querySelectorAll('.img:not(:first-child)');

      images.forEach((img, index) =>{
        scaleTl.to(img,{
          opacity: 1,
          scale:1,
          duration: 1.25,
          ease: 'power3.inOut'
        },'>-0.5');
      });

      mainTl
      .add(revealerTl)
      .add(scaleTl, '-=1.25')
      .add(() =>{
        document.querySelectorAll('.img:not(.main)')
        .forEach((img) => img.remove());

        const state = Flip.getState('.main');

        const imagesContainer = document.querySelector('.images');
        imagesContainer.classList.add('stacked-container');

        document.querySelectorAll('.main').forEach((img, i) =>{
          img.classList.add('stacked');
          img.style.order = i;
          gsap.set('.img.stacked',{
            clearProps: 'transform, top, left',
          });
        });

        return Flip.from(state,{
          duration: 2,
          ease: 'hop',
          absolute: true,
          stagger:{
            amount: -0.3,
          },
        });
      })
      .to('.word h1, .nav-item p, .line p, .site-info h2 .line span',{
      y: 0,
      duration: 3,
      ease: 'hop2',
      stagger: 0.1,
      delay: 2.25,
      })
      .to('.cover-img',{
        clipPath: 'polygon(0% 100%, 100% 100%, 100% 0%, 0% 0%)',
        duration: 2,
        ease: 'hop',
        delay: -5.75,
      })
    });
    
  </script>
</body>

</html>
