<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rolling Text</title>
  <link rel="stylesheet" href="gsap51.css">
</head>
<body>
   <main class="app">
    <section class="section">
      <div class="section-wrapper">
        <div class="r-container">
          <div class="r-text" data-text="Rome&rarr;"></div>
          <div class="r-text" data-text="&larr;Osaka"></div>
          <div class="r-text" data-text="+London"></div>
        </div>
        <div class="r-container abs abs-top">
          <span>WADM</span>
          <span>&copy;2023</span>
        </div>
        <div class="r-container abs abs-bottom">
          <span class="re-roll">+re-Roll</span>
          <span>Rolling-Text</span>
          <span>&darr;&darr;&darr;</span>
        </div>
        <div class="section-media">
          <img src="./img/bg02.jpg" alt="">
        </div>
      </div>
    </section>
   </main>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script>
    const rollingTexts = document.querySelectorAll('.r-text');

    const cloneText = () =>{
      rollingTexts.forEach((text) =>{
        const data = text.dataset.text;

        for(let i=0; i<data.length; i++){
          const inner = document.createElement('span');
          inner.classList.add('r-inner');

          text.appendChild(inner);

          const letter = document.createElement('span');
          letter.classList.add('r-letter');

          letter.textContent = data[i];
          inner.appendChild(letter);

          for(let i=0; i<6; i++){
            clone = letter.cloneNode(true);
            letter.after(clone);
          }
        }
      });

      animateText();

    };

    const animateText =()=>{
      const rollingInners = document.querySelectorAll('.r-inner');

      gsap.set(rollingInners,{
        // -100% = 1 row of inner letters
        y: '-700%',
      });

      const tl = gsap.timeline({
        paused: true,
        defaults: {ease: 'power4.inOut'},
      });
      tl.to(rollingInners,{
        duration: 4,
        y: '0',
        stagger:{
          grid: 'auto',
          from: 'random',
          ease: 'power4.inOut',
          amount: 1.2,
        },
      }).fromTo('r-letter',{
        filter: 'brightness(0.5)'
      },{
        duration: 3,
        filter: 'brightness(1)',
        stagger: {
          grid: 'auto',
          ease: 'power4.inOut',
          amount: 0.8,
        },
      },0);

      tl.play()

      document.querySelector('.re-roll').addEventListener('click', ()=>{
        tl.reverse().then(()=>{
          tl.play();
        });
      });
    };

    cloneText();
  </script>
</body>
</html>
