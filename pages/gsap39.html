<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSAP Landing</title>
  <link rel="stylesheet" href="./gsap39.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Roboto+Condesed:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="letter-wrap">
        <div class="letter v"><span>v</span></div>
        <div class="letter-reveal"></div>
      </div>
      <div class="letter-wrap">
        <div class="letter a">
          <span>a</span>
          <div class="circle"></div>
        </div>
        <div class="letter-reveal"></div>
      </div>
      <div class="letter-wrap">
        <div class="letter a2">
          <span>a</span>
          <div class="circle"></div>
        </div>
        <div class="letter-reveal"></div>
      </div>
      <div class="letter-wrap">
        <div class="letter y">
          <span>y</span>
          <div class="circle"></div>
        </div>
        <div class="letter-reveal"></div>
      </div>
      <div class="letter-wrap">
        <div class="letter u"><span>u</span></div>
        <div class="letter-reveal"></div>
      </div>
    </div>
  </div>
  <script>
    gsap.from('.letter',2,{
      top: '100px',
      ease: 'power4.inOut',
      stagger:{
        amount: 0.5,
      },
    });

    gsap.to('.a2',1,{
      top: '20px',
      ease: 'power2.inOut',
      delay: 3,
    });

    gsap.to('.header',4,{
      scale: 2,
      ease: 'power2.inOut',
      delay: 4,
    });

    gsap.to('.circle',1,{
      opacity: 1,
      ease: 'power1.inOut',
      delay: 4,
    });

    gsap.to('span',2,{
      opacity: 0,
      ease: 'power1.inOut',
      delay: 4.5,
    });

    gsap.to('.circle',3,{
      scale: 10,
      ease: 'power1.inOut',
      delay: 6,
      stagger:{
        amount: 0.75,
      },
    });

    gsap.to('.a .circle',3,{
      top: '64px',
      left: '-180px',
      ease: 'power1.inOut',
      delay: 6,
    });
    gsap.to('.y .circle',3,{
      top: '64px',
      left: '180px',
      ease: 'power1.inOut',
      delay: 6.5,
    });
  </script>
</body>
</html>
