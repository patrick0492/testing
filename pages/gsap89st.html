<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSAP ST Text Animation</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="gsap89.css">
</head>
<body>
  <main class="app">
    <section class="scroll">
      <div class="scroll-wrapper">
        <div class="scroll-gallery">
          <div class="scroll-gallery-container">
            <div class="scroll-gallery-row">
              <img src="./img/0034.jpg" alt="" class="scroll-gallery-row-image">
            </div>
            <div class="scroll-gallery-row">
              <img src="./img/0035.jpg" alt="" class="scroll-gallery-row-image">
              <img src="./img/0036.jpg" alt="" class="scroll-gallery-row-image">
            </div>
            <div class="scroll-gallery-row">
              <img src="./img/0037.jpg" alt="" class="scroll-gallery-row-image">
              <img src="./img/0038.jpg" alt="" class="scroll-gallery-row-image">
            </div>
          </div>
        </div>
        <div class="scroll-text">
          <div class="scroll-text-subtitle">
            <span> 本 語 で </span>
            <h1>( Takumi )</h1>
            <h2>Innovation</h2>
          </div>
          <div class="scroll-text-title">
            <div class="scroll-text-title-word">
              <span>T</span>
              <span>h</span>
              <span>e</span>
            </div>
            <div class="scroll-text-title-word">
              <span>M</span>
              <span>a</span>
              <span>k</span>
              <span>i</span>
              <span>n</span>
              <span>g</span>
            </div>
          </div>
          <div class="scroll-text-title">
            <div class="scroll-text-title-word">
              <span>O</span>
              <span>f</span>
            </div>
          </div>
          <div class="scroll-text-title">
            <div class="scroll-text-title-word">
              <span>a</span>
            </div>
            <div class="scroll-text-title-word">
              <span>M</span>
              <span>a</span>
              <span>s</span>
              <span>t</span>
              <span>e</span>
              <span>r</span>
              <span>p</span>
              <span>i</span>
              <span>e</span>
              <span>c</span>
              <span>e</span>
            </div>
          </div> 
        </div>
      </div>
    </section>
  </main>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.1/dist/lenis.min.js"></script>
  <script>
    gsap.registerPlugin(ScrollTrigger);

    const section = {
      element: document.querySelector('.scroll'),
      subtitle: document.querySelectorAll('.scroll-text-subtitle > *'),
      titleChars: document.querySelectorAll('.scroll-text-title-word span'),
      gallery: document.querySelectorAll('.scroll-gallery'),
      galleryImages: document.querySelectorAll('.scroll-gallery img'),
    };

    const init = () => {
      gsap.set(section.subtitle,{
        autoAlpha: 0,
      });
      gsap.set(section.titleChars,{
        scale: 0,
        yPercent: -60,
        z: -40,
        rotateY: 180,
        transformOrigin: '50% 50%',
      });

      initLenis();
      animateScroll();
    };

    const initLenis = () => {
      const lenis = new Lenis({
        lerp: 0.05,
      });

      lenis.on('scroll', ScrollTrigger.update);

      gsap.ticker.add((time) => lenis.raf(time * 1000));
      gsap.ticker.lagSmoothing(0);
    };

    const animateScroll = () =>{
      const timeline = gsap.timeline({
        scrollTrigger: {
          trigger: section.element,
          start: 'top top',
          end: 'bottom bottom',
          scrub: true,
          pin: false,
        },
      });
      timeline.to(section.gallery,{yPercent: -100})
              .to(section.galleryImages,{y: -150, stagger: 0.05},0)
              .to(section.titleChars,{scale: 1, yPercent: 0, z: 0, rotateY: 0, stagger: {each: 0.1, grid: 'auto', from: 'center',}},0)
              .to(section.subtitle,{autoAlpha: 1}, 0.25)
    };

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
