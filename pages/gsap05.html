<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSAP</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="gsap05.css">
</head>
<body>
  <div class="container">
    <div class="top">
      <div class="logo fade">
        <a href="#!" class="fade">F</a>
      </div>
      <div class="nav">
        <ul>
          <li class="fade"><a href="#!">girls</a></li>
          <li class="fade"><a href="#!">kids</a></li>
          <li class="fade"><a href="#!">woman</a></li>
        </ul>
      </div>
      <div class="user">
        <ul>
          <li class="fade"><a href="#!"><i class="fa fa-search"></i></a></li>
          <li class="fade"><a href="#!"><i class="fa fa-user"></i></a></li>
        </ul>
      </div>
    </div>
    <div class="showcase">
      <p class="tag fade">fashion</p>
      <h1 class="top fade2">real</h1>
      <h1 class="mid fade2">time</h1>
      <h1 class="bot fade2">fashion</h1>
      <div class="sm-img sm1">
        <div class="inner">
          <div class="img-small"></div>
        </div>
      </div>
      <div class="sm-img sm2">
        <div class="inner">
          <div class="img-small"></div>
        </div>
      </div>
      <p class="fade">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Unde, esse et nam eum voluptate voluptatem a.</p>
    </div>
    <div class="call-to-act fade">
      <button>explore</button>
    </div>
    <div class="bg"></div>
    <div class="img"></div>
  </div>

  <div class="overlay"></div>
  
  <!-- .li$.li*4>a.a$ voor vier li met opvolgende classnummers plus links met hetzelfde -->
  <!-- divname>divname>flexone+.flextwo -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.7.1/gsap.min.js"></script>
  <script>
    gsap.from('.bg',{
      width: 0,
      left: 0,
      duration: 2,
      delay: .8
    })
    gsap.from('.img',{
      scale: 1.3,
      opacity: 0,
      duration: .8,
      delay: .8
    })
    gsap.to('.fade',{
      y: 0,
      opacity: 1,
      duration: .5,
      delay: .8,
      stagger: .2
    })
    gsap.to('.fade2',{
      y: 0,
      opacity: 1,
      duration: .5,
      delay: .8,
      stagger: .2
    })
    gsap.from('.sm-img',{
      scaleX: 0,
      duration: .6,
      delay: .8
    })
    gsap.from('.inner',{
      scaleX: 0,
      duration: .4,
      delay: 1.3
    })
    gsap.from('.img-small',{
      scale: 1.5,
      duration: .4,
      delay: 2,
      opacity: 1.5
    })
  </script>
</body>
</html>
