<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSAP ScrollTrigger</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Signika:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="gsap84.css">
  </head>
  <body>
    <div class="container">
      <div class="intro-copy">
        <p>This message stays right here,</p>
        <p>no matter where you go,</p>
        <p>it won't move an inch,</p>
        <p>even if you scroll up or down.</p>
      </div>
      <div class="headers">
        <section id="section-1">
          <h1>Vaccum</h1>
        </section>
        <section id="section-2">
          <h1>Ember</h1>
        </section>
        <section id="section-3">
          <h1>Scratch</h1>
        </section>
        <section id="section-4">
          <h1>Azure</h1>
        </section>
        <section id="section-5">
          <h1>Synthesis</h1>
        </section>
        <section id="section-6">
          <h1>Euphoria</h1>
        </section>
        <section id="section-7">
          <h1>The End</h1>
        </section>
        <div class="spacer"></div>
      </div>
      <div class="section-previews">
        <div class="img" id="preview-1">
          <img src="./img/0039.jpg" alt="">
        </div>
        <div class="img" id="preview-2">
          <img src="./img/0040.jpg" alt="">
        </div>
        <div class="img" id="preview-3">
          <img src="./img/0041.jpg" alt="">
        </div>
        <div class="img" id="preview-4">
          <img src="./img/0038.jpg" alt="">
        </div>
        <div class="img" id="preview-5">
          <img src="./img/0043.jpg" alt="">
        </div>
        <div class="img" id="preview-6">
          <img src="./img/0044.jpg" alt="">
        </div>
      </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script>
      gsap.registerPlugin(ScrollTrigger);
      function addImageScaleAnimation() {
        gsap.utils.toArray("section").forEach((section, index) => {
          const image = document.querySelector(`#preview-${index + 1} img`);

          const startCondition = index === 0 ? "top top" : "bottom bottom";

          gsap.to(image, {
            scrollTrigger: {
              trigger: section,
              start: startCondition,
              end: () => {
                const viewportHeight = window.innerHeight;
                const sectionBottom = section.offsetTop + section.offsetHeight;
                const additionalDistance = viewportHeight * 0.5;
                const endValue = sectionBottom - viewportHeight + additionalDistance;
                return `+=${endValue}`;
              },
              scrub: 1,
            },
            scale: 3,
            ease: "none",
          });
        });
      }

      addImageScaleAnimation();

      function animateClipPath(
        sectionId,
        previewId,
        startClipPath,
        endClipPath,
        start = "top center",
        end = "bottom top"
      ) {
        let section = document.querySelector(sectionId);
        let preview = document.querySelector(previewId);

        ScrollTrigger.create({
          trigger: section,
          start: start,
          end: end,
          onEnter: () => {
            gsap.to(preview, {
              scrollTrigger: {
                trigger: section,
                start: start,
                end: end,
                scrub: 0.125,
              },
              clipPath: endClipPath,
              ease: "none",
            });
          },
        });
      }

      animateClipPath(
        "#section-1",
        "#preview-1",
        "polygon(0% 100%, 100% 100%, 100% 100%, 0% 100%)",
        "polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)"
      );

      const totalSections = 7;

      for (let i = 2; i <= totalSections; i++) {
        let currentSection = `#section-${i}`;
        let prevPreview = `#preview-${i - 1}`;
        let currentPreview = `#preview-${i}`;

        animateClipPath(
          currentSection,
          prevPreview,
          "polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)",
          "polygon(0% 0%, 100% 0%, 100% 0%, 0% 0%)",
          "top bottom",
          "center center"
        );

        if (i < totalSections) {
          animateClipPath(
            currentSection,
            currentPreview,
            "polygon(0% 100%, 100% 100%, 100% 100%, 0% 100%)",
            "polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)",
            "center center",
            "bottom top"
          );
        }
      }

    </script>
  </body>
</html>
