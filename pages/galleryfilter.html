<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery Filter</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="galleryfilter.css">
</head>
<body>
  <div id="side-menu" class="fa fa-bars"></div>

  <div class="side-bar">
    <h1 class="headding">filter images</h1>
    <div class="box">
      <h3 class="title">search images :</h3>
      <input type="text" placeholder="search images..." id="search-box">
    </div>
    <div class="box">
      <h3 class="title">category :</h3>
      <div class="category">
        <div class="btn active" data-category="all"> all </div>
        <div class="btn" data-category="cocktail"> cocktail </div>
        <div class="btn" data-category="balloon"> balloon </div>
        <div class="btn" data-category="building"> building </div>
        <div class="btn" data-category="man"> man </div>
      </div>
    </div>
    <div class="box">
      <h3 class="title">type :</h3>
      <div class="type">
        <div class="btn active" data-type="all"> all types </div>
        <div class="btn" data-type="jpg"> jpg </div>
        <div class="btn" data-type="png"> png </div>
        <div class="btn" data-type="PNG"> PNG </div>
      </div>
    </div>
  </div>

  <div class="gallery">
    <h1 class="headding">image gallery</h1>
    <div class="image-container">
      <img src="img/cocktail.jpg" alt="" data-cat="cocktail" data-search="cocktail alcohol color">
      <img src="img/balloon1.jpg" alt="" data-cat="balloon" data-search="balloon color dog">
      <img src="img/balloon3.jpg" alt="" data-cat="balloon" data-search="balloon color dog">
      <img src="img/BG01.PNG" alt="" data-cat="man" data-search="man model guess">
      <img src="img/bg07.png" alt="" data-cat="building" data-search="building architecture class">
      <img src="img/BG02.PNG" alt="" data-cat="man" data-search="man model guess">
      <img src="img/balloon2.jpg" alt="" data-cat="balloon" data-search="balloon color dog">
      <img src="img/cocktail2.jpg" alt="" data-cat="cocktail" data-search="cocktail alcohol color">
      <img src="img/BG03.PNG" alt="" data-cat="man" data-search="man model guess">
      <img src="img/bg05.png" alt="" data-cat="building" data-search="building architecture class">
      <img src="img/bg06.png" alt="" data-cat="building" data-search="building architecture class">
      <img src="img/BG04.PNG" alt="" data-cat="man" data-search="man model guess">
      <img src="img/balloon4.jpg" alt="" data-cat="balloon" data-search="balloon color dog">
    </div>
  </div>

  <div class="popup-image"><img src="img/cocktail.jpg" alt=""></div>
  <script src="galleryfilter.js"></script>
</body>
</html>
