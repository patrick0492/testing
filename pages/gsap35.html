<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSAP | Text</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.8.0/gsap.min.js"></script>
  <link rel="stylesheet" href="gsap35.css">
</head>
<body>
  <nav>
    <h1 class="logo">Skincare.</h1>
  </nav>
  <div class="hero-section">
    <img src="./img/bg02.jpg" class="hero-img" alt="">
    <div class="cta">
      <div class="cta-text">
        <h2><span class="cta1">One</span></h2>
        <h2><span class="cta2">stop</span></h2>
        <h2><span class="cta3">shop</span></h2>
      </div>
      <div class="cta-text">
        <h2><span class="cta4">to</span></h2>
        <h2><span class="cta5">perfect</span></h2>
        <h2><span class="cta6">skin</span></h2>
      </div>
      <button class="cta-btn">Explore</button>
    </div>
  </div>

  <script>
    const tl = gsap.timeline({defaults: {duration: .75, ease: 'Power3.easeOut'}});

    tl.fromTo('.hero-img', {
      scale: 1.3, 
      borderRadius: '0rem'}, 
      {scale: 1, 
      borderRadius: '2rem', 
      delay: 0.35, 
      duration: 2.5,
      ease: 'elastic.out(1.5,1)'});
      tl.fromTo('.cta1', {x:'100%', opacity: 0.5}, {x: 0, opacity: 1}, '<20%');
      tl.fromTo('.cta3', {x:'-100%', opacity: 0.5}, {x: 0, opacity: 1}, '<20%');
      tl.fromTo('.cta2', {y:'100%', opacity: 0.5}, {y: 0, opacity: 1}, '<20%');
      tl.fromTo('.cta4', {x:'100%', opacity: 0.5}, {x: 0, opacity: 1}, '<20%');
      tl.fromTo('.cta6', {x:'-100%', opacity: 0.5}, {x: 0, opacity: 1}, '<20%');
      tl.fromTo('.cta5', {y:'100%', opacity: 0.5}, {y: 0, opacity: 1}, '<20%');
      tl.fromTo('.cta-btn', {y: 20, opacity: 0}, {y: 0, opacity: 1},'<');

      // Split text alternative
      const logo = document.querySelector('.logo');
      const letters = logo.textContent.split('');

      logo.textContent = "";

      letters.forEach(letter =>{
        logo.innerHTML += '<span class="letter">' + letter + '</span>';  
      });

      gsap.set('.letter', {display: 'inline-block'});
      gsap.fromTo('.letter', {y: '100%'},{y: 0, delay: 2, stagger: .05, ease: 'back.out(3)'});
  </script>
</body>
</html>
