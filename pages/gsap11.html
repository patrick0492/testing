<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSAP</title>
  <link rel="stylesheet" href="gsap11.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.6.0/gsap.min.js"></script>
  <!-- ionicons  -->
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</head>
<body>
  <div class="container">
    <div class="navbar">
      <div class="navbar-item logo">
        <ion-icon name="videocam-sharp"></ion-icon>
      </div>
      <div class="menu-toggle navbar-item">menu</div>
    </div>
    <div class="centerbar">
      <div class="centerbar-item block-1">
        <div class="block-1-container">
          <span>produced by cg/'21</span>
        </div>
      </div>
      <div class="centerbar-item block-2">
        <div class="block-2-container">
          open air show now <br>
          goes digital.
        </div>
      </div>
    </div>
    <div class="header">
      <div class="header-container">
        <div class="header-item">N</div>
        <div class="header-item">R</div>
      </div>
    </div>
    <div class="images">
      <div class="img img-one"></div>
      <div class="img img-two"></div>
      <div class="img img-three"></div>
    </div>
    <div class="bottombar">
      <div class="bottombar-item year">2021</div>
      <div class="bottombar-item mail">get in touch</div>
    </div>
  </div>

  <script>
    TweenMax.staggerFrom('.navbar > div', 0.8,{
      y: '60',
      ease: Power3.easeInOut,
      opacity: 0,
      delay: 1,
    }, 0.1);

    TweenMax.staggerFrom('.centerbar > div', 0.8,{
      x: '-40',
      ease: Power3.easeInOut,
      opacity: 0,
      delay: 1.2,
    }, 0.1);

    TweenMax.staggerFrom('.bottombar > div', 0.8,{
      y: '60',
      ease: Power3.easeInOut,
      opacity: 0,
      delay: 1,
    }, 0.1);

    TweenMax.staggerFrom('.images > div', 0.8,{
      x: '-200',
      ease: Power3.easeInOut,
      opacity: 0,
      delay: 1.2,
    }, 0.16);

    TweenMax.staggerFrom('.header-container > div', 3,{
      y: '500',
      ease: Elastic.easeOut.config(2,0.4),
      delay: 2
    }, 0.2)
  </script>
</body>
</html>
