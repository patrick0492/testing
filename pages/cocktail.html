<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cocktail slider</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="cocktail.css">
</head>
<body>
  <div class="header" id="header">
    <nav>
      <h2>Cock<span>tail</span></h2>
      <ul>
        <li><a href="#!" id="modelpink">Pink</a></li>
        <li><a href="#!" id="modelblue">Blue</a></li>
        <li><a href="#!" id="modelorange">Orange</a></li>
      </ul>
      <div>
        <a href="#!" class="btn">Reserve Now</a>
      </div>
    </nav>

    <div class="info">
      <div>
        <h2>1.9 s</h2>
        <p>60mph</p>
      </div>
      <div>
        <h2>200mph</h2>
        <p>Top Speed</p>
      </div>
      <div>
        <h2>396 mi</h2>
        <p>Max Range</p>
      </div>
      <div class="line">
        
      </div>
      <div>
        <h2 id="model">Model Pink</h2>
      </div>
    </div>
  </div>
  <script>
    var header = document.getElementById('header');
    var mp = document.getElementById('modelpink');
    var mb = document.getElementById('modelblue');
    var mo = document.getElementById('modelorange');
    var model = document.getElementById('model');

    mp.onclick = function(){
      header.style.backgroundImage = "url(img/cocktail01.jpg)";
      model.innerHTML = 'Model Pink'
    }
    mb.onclick = function(){
      header.style.backgroundImage = "url(img/cocktail02.jpg)";
      model.innerHTML = 'Model Blue'

    }
    mo.onclick = function(){
      header.style.backgroundImage = "url(img/cocktail03.jpg)";
      model.innerHTML = 'Model Orange'

    }
  </script>
</body>
</html>
