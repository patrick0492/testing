  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function(){
      const counter3 = document.querySelector('.counter-3');

      for(let i = 0; i < 2; i++){
        for (let j = 0; j < 10; j++){
          const div = document.createElement('div');
          div.className = 'num';
          div.textContent = j;
          counter3.appendChild(div);
        }
      }
      const finalDiv = document.createElement('div');
      finalDiv.className = 'num';
      finalDiv.textContent = '0';
      counter3.appendChild(finalDiv);

      function animate(counter, duration, delay = 0){
        const numHeight = counter.querySelector('.num').clientHeight;
        const totalDistance = (counter.querySelectorAll('.num').length - 1) * numHeight;

        gsap.to(counter,{
          y: -totalDistance,
          duration: duration,
          delay: delay,
          ease: 'power2.inOut',
        });
      }

      animate(counter3, 5);
      animate(document.querySelector('.counter-2'), 6);
      animate(document.querySelector('.counter-1'), 2, 4);
    });

    gsap.to('.digit',{
      top: '-150px',
      stagger: {
        amount: 0.25,
      },
      delay: 6,
      duration: 1,
      ease: 'power4.inOut',
    });

    gsap.from('.loader-1', {
      width: 0,
      duration: 6,
      ease: 'power2.inOut'
    });
    gsap.from('.loader-2', {
      width: 0,
      delay: 1.9,
      duration: 2,
      ease: 'power2.inOut',
    });
    gsap.to('.loader', {
      background: 'none',
      delay: 6,
      duration: 0.1,
    });
    gsap.to('.loader-1',{
      rotate: 90,
      y: -50,
      duration: 0.5,
      delay: 6,
    });
    gsap.to('.loader-2', {
      x: -75,
      y: 75,
      duration: 0.5,
    }, '<');
    gsap.to('.loader', {
      scale: 40,
      duration: 1,
      delay: 7,
      ease: 'power2.inOut'
    })
    gsap.to('.loader', {
      rotate: 45,
      y: 500,
      x: 2000,
      duration: 1,
      delay: 7,
      ease: 'power2.inOut',
    });

    gsap.to('.loading-screen', {
      opacity: 0,
      duration: 0.5,
      delay: 7.5,
      ease: 'power1.inOut',
    });
    // gsap.to('h1', {
    //   delay: 7,
    //   y: -80,
    //   ease: 'power4.inOut',
    //   stagger: {
    //     amount: 0.1,
    //   },
    // })

    document.addEventListener('DOMContentLoaded', function(){
      function isInViewport(el){
        const rect = el.getBoundingClientRect();
        return(
          rect.top >= 0 &&
          rect.left >= 0 &&
          rect.bottom <= 
          (window.innerHeight || document.documentElement.clientHeight) && rect.right <= (window.innerWidth || document.documentElement.clientWidth)
        );
      }
      const rows = document.querySelectorAll('.row');
      rows.forEach((row) => {
        if (isInViewport(row)) {
          const img = row.querySelector('img');
          if(row.querySelector('.left')){
            gsap.to(img, {
              clipPath: 'polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)',
            });
          } else {
            gsap.to(img, {
              clipPath: 'polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)',
            });
          }
        }
      });
      gsap.utils.toArray('.img-container.right img, .img-wrapper').forEach((img) =>{
        gsap.to(img, {
          clipPath: 'polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)',
          scrollTrigger: {
            trigger: img,
            start: 'top 75%',
            end: 'bottom 70%',
            scrub: true,
          }
        });
      });
      gsap.utils.toArray('.img-container.left img, .img-wrapper').forEach((img) =>{
        gsap.to(img, {
          clipPath: 'polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)',
          scrollTrigger: {
            trigger: img,
            start: 'top 75%',
            end: 'bottom 70%',
            scrub: true,
          }
        });
      });
      gsap.utils.toArray('.img-container p').forEach((text) =>{
        gsap.from(text, {
          opacity: 0,
          y: 20,
          scrollTrigger: {
            trigger: text,
            start: 'top 90%',
            toggleActions: 'play none none reverse',
          },
        });
      });
    });

  </script>
