<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSAP</title>
  <link rel="stylesheet" href="gsap03.css">
</head>
<body>
  <header>
    <div class="header-wrapper">
      <h1 class="anim">Graphic Design Experiments With</h1>
      <h1 class="anim1">Grid + Writing Modes</h1>
      <div class="references">
        <p>References:</p>
        <ul>
          <li>Writing modes <br>level 3</li>
          <li>Writing modes <br>level 4</li>
          <li>on mdn</li>
          <li>on can i use</li>
          <li>my article about</li>
        </ul>
      </div>
      <p class="red-line"></p>
      <p class="more-examples">
        <a href="#!">More Examples</a>
      </p>
    </div>
  </header>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.7.1/gsap.min.js"></script>
  <script>
    gsap.from('.anim',{duration:1, y:-150, opacity:0})
    gsap.from('.anim1',{duration:1, y:150, opacity:0, delay:1.1})
    gsap.from('.more-examples',{duration:1, x:200, opacity:0, delay:2})
    gsap.from('.references',{duration:1, scaleY:-1, opacity:0, delay:3})
    gsap.from('.red-line',{duration:1, scaleX:0, opacity:0, delay:4})
    gsap.from('.header-wrapper',{transform:'rotate(-45deg)', delay:5})
  </script>
</body>
</html>
