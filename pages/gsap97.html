<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSAP Landing</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Signika:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="gsap97.css"> 
</head>
<body>
  <nav>
    <div class="nav-logo">
      <a href="#!">Maria Cozamanis</a>
    </div>
    <div class="nav-items">
      <a href="#!">Runway</a>
      <a href="#!">Lookbook</a>
      <a href="#!">Campaigns</a>
      <a href="#!">Biography</a>
    </div>
  </nav>
  <section class="hero">
    <div class="hero-overlay">
      <div class="counter">
        <h1>0</h1>
      </div>
      <div class="overelay-text-container">
        <div class="overlay-text">
          <p>Structure</p>
          <p>Designed Identity</p>
          <p>Welcome</p>
        </div>
      </div>
    </div>
    <div class="hero-images">
       <div class="img"><img src="./img/0005.jpg" alt=""></div>
       <div class="img"><img src="./img/0009.jpg" alt=""></div>
       <div class="img hero-img"><img src="./img/0012.jpg" alt=""></div>
       <div class="img"><img src="./img/0017.jpg" alt=""></div>
       <div class="img"><img src="./img/0011.jpg" alt=""></div>
    </div>

    <div class="hero-header">
      <h1>Maria Cozamanis</h1>
    </div>
  </section>
 
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script> -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.0/CustomEase.min.js"></script>
  <!-- <script src="https://unpkg.com/split-type"></script> -->
  <!-- <script src="https://unpkg.com/lenis@1.1.1/dist/lenis.min.js"></script> -->
   <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/SplitText.min.js"></script>
  <script>
    gsap.registerPlugin(CustomEase, SplitText);
    CustomEase.create('hop', '0.85, 0, 0.15, 1');

    const counterProgress = document.querySelector('.counter h1');
    const counter = {value: 0};

    document.addEventListener('DOMContentLoaded', () =>{
      let split = SplitText.create('.hero-header h1',{
        type: 'words', 
        mask: 'words',
        wordsClass: 'word',
      });

      const counterTl = gsap.timeline({delay: 0.5});
      const overlayTextTl = gsap.timeline({delay: 0.75});
      const revealTl = gsap.timeline({delay: 0.5});

      counterTl.to(counter, {
        value: 100,
        duration: 5,
        ease: 'power2.out',
        onUpdate: () =>{
          counterProgress.textContent = Math.floor(counter.value);
        },
      });

      overlayTextTl.to('.overlay-text',{
        y: '0',
        duration: 0.75,
        ease: 'hop'
      })
      .to('.overlay-text',{
        y: '-2rem',
        duration: 0.75,
        ease: 'hop',
        delay:  0.75,
      })
      .to('.overlay-text',{
        y: '-4rem',
        duration: 0.75,
        ease: 'hop',
        delay: 0.75,
      })
      .to('.overlay-text',{
        y: '-6rem',
        duration: 0.75,
        ease: 'hop',
        delay: 1,
      });

      revealTl
      .to('.img',{
        y: 0,
        opacity: 1, 
        stagger: 0.05,
        duration: 1,
        ease: 'hop',
      })
      .to('.hero-images',{
        gap: '0.75vw',
        duration: 1,
        delay: 0.5,
        ease: 'hop',
      })
      .to('.img',{
        scale: 1,
        duration: 1,
        ease: 'hop',
      }, '<')
      .to('.img:not(.hero-img)',{
        clipPath: 'polygon(0% 0%, 100% 0%, 100% 0%, 0% 0%)',
        duration: 1,
        stagger: 0.1,
        ease: 'hop',
      })
      .to('.hero-img',{
        scale: 2,
        duration: 1,
        ease: 'hop',
      })
      .to('.hero-overlay',{
        clipPath: 'polygon(0% 0%, 100% 0%, 100% 0%, 0% 0%)',
        duration: 1,
        ease: 'hop',
      })
      .to('.hero-header h1 .word',{
        y: '0',
        duration: 0.75,
        stagger: 0.1,
        ease: 'power2.out',
      },'-=0.5')

    });

  </script>
</body>
</html>
