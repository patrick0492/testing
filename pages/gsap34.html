<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSAP | Intro</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/2.0.2/TweenMax.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/2.0.2/anime.min.js"></script>
  <link rel="stylesheet" href="gsap34.css">
</head>
<body>
  <div class="navbar">
    <div class="site-info">elevated</div>
    <div class="site-menu">
      <div class="menu-item">projects</div>
      <div class="menu-item">about</div>
      <div class="menu-item">contact</div>
    </div>
  </div>
  <div class="container">
    <div class="block b-1"></div>
    <div class="block b-2"></div>
    <div class="block b-3"></div>
    <div class="block b-4"></div>
    <div class="block b-5"></div>
    <div class="block b-6"></div>
    <div class="block b-7"></div>
  </div>
  <div class="overlay"></div>
  <p class="title">Reach the fullest!</p>

  <script>
    var textWrapper = document.querySelector('.title');
    textWrapper.innerHTML = textWrapper.textContent.replace(/\S/g, "<span class='letter'>$&</span>");

    anime.timeline().add({
      targets: '.title .letter',
      translateY: [-200,0],
      easing: "easeOutExpo",
      duration: 1400,
      delay: (el, i) => 6500 + 30 * i,
    });

    TweenMax.staggerFrom('.container > .block', 2,{
      y: '110%',
      ease: Expo.easeInOut,
      delay: 1
    },0.4);

    TweenMax.to('.overlay', 0.5,{
      y: '100%',
      ease: Expo.easeInOut,
      delay: 5.2,
    });

    TweenMax.to('.container', 2,{
      scale: '2',
      y: '90%',
      ease: Expo.easeInOut,
      delay: 5.5,
    });
    TweenMax.staggerFrom('.navbar > div', 1.6,{
      opcity: 0,
      y: -100,
      ease: Expo.easeInOut,
      delay: 6,
    }, 0.08);

    TweenMax.staggerFrom('.site-menu > div', 1,{
      opacity: 0,
      y: -100,
      ease: Power2.easeOut,
      delay: 6.5,
    },.1);
  </script>
  
</body>
</html>
