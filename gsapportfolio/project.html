<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSAP Portfolio</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/2.1.3/TweenMax.min.js"></script>
  <!-- locomotive-scroll -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/locomotive-scroll@3.2.5/dist/locomotive-scroll.min.css">
  <script src="https://cdn.jsdelivr.net/npm/locomotive-scroll@3.2.5/dist/locomotive-scroll.min.js"></script>
</head>
<body id="js-scroll">
  <div class="wrapper">
    <nav class="menu">
      <div class="menu-logo">
        <a href="index.html">kd</a>
      </div>
      <div class="menu-items">
        <div class="menu-items-link active">
          <a href="project.html">Projects</a>
        </div>
        <div class="menu-items-link">
          <a href="about.html">About</a>
        </div>
      </div>
    </nav>

     <div class="project-container" data-scroll-section="">
       <div class="project-container-title" data-scroll>
         <h1 class="anime-js-title">Creative mix</h1>
       </div>
       <div class="project-container-subtitle" data-scroll>
         <p>Visual design</p>
       </div>

       <div class="project-container-images">
         <div class="project-image project-image-one" data-scroll data-scroll-speed="1"></div>
         <div class="project-image project-image-two" data-scroll data-scroll-speed="4"></div>
         <div class="project-image project-image-three" data-scroll data-scroll-speed="2"></div>
         <div class="project-image project-image-four" data-scroll data-scroll-speed="4"></div>
       </div>

       <div class="project-next-link" data-scroll>
         <a href="project.html">Next</a>
       </div>
     </div> 

  </div>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/2.0.2/anime.min.js"></script>
  <script>
    // smooth scroll 
    const scroll = new LocomotiveScroll({
        el: document.querySelector('#js-scroll'),
        smooth: true,
        smoothMobile: true,
        inertia: 0.75
    });

    // project title animation 
    var textWrapper = document.querySelector('.anime-js-title');
    textWrapper.innerHTML = textWrapper.textContent.replace(/\S/g, "<span class='letter'>$&</span>");

    anime.timeline()
        .add({
            targets: '.anime-js-title .letter',
            translateY: [60, 0],
            translateZ: 0,
            opacity: [0, 1],
            easing: "easeOutExpo",
            duration: 1200,
            delay: (el, i) => 600 + 30 * i
        });

    // project subtitle animation 
    TweenMax.from(".project-container-subtitle", 2, {
        y: 10,
        opacity: 0,
        ease: Expo.easeInOut
    });

    // project image fade 
    TweenMax.from(".project-image-one", 2, {
        opacity: 0,
        ease: Expo.easeInOut
    });
</script>
</body>
</html>
